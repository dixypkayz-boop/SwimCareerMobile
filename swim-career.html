  let last = performance.now(); const loop = now => { if (!running) return; const dt = Math.min(.05, (now - last) / 1000); last = now; c.clearRect(0, 0, cv.width, cv.height); if (flashes > 0 && Math.random() < .3) { c.fillStyle = 'rgba(255,255,255,.9)'; c.beginPath(); c.arc(Math.random() * cv.width, Math.random() * cv.height * .5, 3, 0, 7); c.fill(); flashes -= dt; } for (let i = parts.length - 1; i >= 0; i--) { const q = parts[i]; q.life -= dt; if (q.life <= 0) { parts.splice(i, 1); continue; } q.vy += 500 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .99; q.rot += q.vr * dt; c.save(); c.translate(q.x, q.y); c.rotate(q.rot); c.globalAlpha = Math.min(1, q.life); c.fillStyle = q.col; c.fillRect(-q.r, -q.r / 2, q.r * 2, q.r); c.restore(); } requestAnimationFrame(loop); }; requestAnimationFrame(loop);
  const ann = d.querySelector('#cer-ann'); const anthem = d.querySelector('#cer-anthem'); const flag = d.querySelector('#cer-flag');
  const timers = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  const reveal = (pl, ms, label) => at(ms, () => { const x = top[pl - 1]; if (!x) return; const el = d.querySelector('#cer-' + pl); el.classList.add('show'); ann.innerHTML = `${label} — <b>${FLAG(x.nat)} ${esc(x.name)}</b> <span class="mono dim">${fmt(x.time)}</span>${x.isPlayer ? ' <span class="gold">— that\'s you!</span>' : ''}`; beep(pl === 1 ? 784 : pl === 2 ? 659 : 523, .35); flashes = 1.2; burst(pl === 1 ? 140 : 50, pl === 1); if (x.isPlayer) d.classList.add('mine'); });

// standing/walking figure used in the walk-out

function processResult(meet, s, mine, splits) {

  const before = { world: playerRank(ev, 'world'), nat: playerRank(ev, 'national') };

  const out = { time, pb: false, prevPB: old ? old.time : null, delta: old ? time - old.time : null, records: [], standards: [], medal: null, advanced: null, selected: false, eliminated: false };

  if (course !== 'SCY' && p.age <= 18) chk('WORLD JUNIOR RECORD', G.records.worldJunior[course][ev], v => { G.records.worldJunior[course][ev] = v; unlock('wjr'); });

  if (course !== 'SCY') chk(CTRY(p.nat).regionLabel.toUpperCase() + ' RECORD', G.records.regional[course][ev], v => { G.records.regional[course][ev] = v; });
  const ag = ageGroupOf(p.age); if (course !== 'SCY' && G.records.ageGroup[course] && G.records.ageGroup[course][ev][ag.id]) chk(`${ag.id} AGE GROUP RECORD`, G.records.ageGroup[course][ev][ag.id], v => { G.records.ageGroup[course][ev][ag.id] = v; });

  out.rank = { before, after };

  const first = p.name.split(' ')[0];

function coachTip() {
  const p = G.player; const nm = nextEnteredMeet(); const club = clubOf(p.clubId); const coach = club.coach.split(' ')[1];
  if (p.injury) return `<div class="panel mb"><b>Coach ${esc(coach)}:</b> <span class="sub">"Rest and rehab. ${p.injury.weeks} more week(s) — no water work."</span></div>`;
  if (!nm) return `<div class="panel mb"><b>Coach ${esc(coach)}:</b> <span class="sub">"Nothing on the calendar. Build the base now — aerobic volume and technique pay off later."</span></div>`;
  const wk = nm.week - G.week; let tip;
  if (wk <= 1) tip = p.fatigue > 30 ? `"${nm.name} is next week and you're carrying fatigue (${Math.round(p.fatigue)}). Full taper — short, sharp, rest."` : `"Race week. Stay sharp: taper swims, starts and turns, plenty of rest."`;
  else if (wk <= 3) tip = p.fatigue > 45 ? `"${wk} weeks to ${nm.name}. Start the taper now — drop the volume, keep the speed."` : `"${wk} weeks out. Pre-competition work: race pace and technique, then ease off."`;
  else if (wk <= 6) tip = `"${wk} weeks to ${nm.name}. This is the overload window — push hard now, taper later."`;
  else tip = `"${wk} weeks until ${nm.name}. Base building: aerobic, threshold and stroke work. Fitness ${Math.round(p.fitness)}."`;
  return `<div class="panel mb" style="border-left:4px solid var(--aqua)"><b>Coach ${esc(coach)}:</b> <span class="sub">${tip}</span> <span class="dim">· ${nm.stars >= 4 ? 'Major meet: taper 2–3 weeks.' : nm.stars === 3 ? 'Championship: taper ~2 weeks.' : 'Minor meet: train through it or a light 1-week taper.'}</span></div>`;
}
function trainingScreen() {

function chartClick(ev, cv) {

    <div class="row mt"><button class="btn primary" onclick="closeModal()">Close</button></div>`);

function drawChart(cv) {

  const swims = G.results.filter(r => r.ev === ev && r.course === course);
  const W = cv.clientWidth || 600, H = 260; cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio; const c = cv.getContext('2d'); c.scale(devicePixelRatio, devicePixelRatio);
  c.clearRect(0, 0, W, H);

  const times = swims.map(s => s.time); const pbLine = []; let best = Infinity; swims.forEach(s => { best = Math.min(best, s.time); pbLine.push(best); });
  const stds = ['provincial', 'national', 'worldA'].map(t => ({ t, v: standardTime(t, ev, course, p.gender, p.age, G.seasonYear, p.nat) }));
  const minT = Math.min(...times, ...stds.filter(s => s.v > Math.min(...times) * 0.9).map(s => s.v)) * 0.985; const maxT = Math.max(...times) * 1.01;
  const L = 60, Rr = 20, T = 16, B = 30; const x = i => L + (W - L - Rr) * (swims.length === 1 ? 0.5 : i / (swims.length - 1)); const y = t => T + (H - T - B) * ((t - minT) / (maxT - minT));
  // grid
  c.strokeStyle = 'rgba(120,170,255,.12)'; c.lineWidth = 1; c.fillStyle = '#5f7396'; c.font = '11px monospace'; c.textAlign = 'right';
  for (let i = 0; i <= 4; i++) { const t = minT + (maxT - minT) * i / 4; c.beginPath(); c.moveTo(L, y(t)); c.lineTo(W - Rr, y(t)); c.stroke(); c.fillText(fmt(t, 1), L - 6, y(t) + 4); }
  // standards

  // swims

  c.fillStyle = 'rgba(57,198,255,.35)'; swims.forEach((s, i) => { c.beginPath(); c.arc(x(i), y(s.time), 4, 0, 7); c.fill(); });
  // pb line
  c.strokeStyle = '#39c6ff'; c.lineWidth = 2.5; c.beginPath(); pbLine.forEach((t, i) => i ? c.lineTo(x(i), y(t)) : c.moveTo(x(i), y(t))); c.stroke();
  const grad = c.createLinearGradient(0, T, 0, H - B); grad.addColorStop(0, 'rgba(57,198,255,.25)'); grad.addColorStop(1, 'rgba(57,198,255,0)'); c.fillStyle = grad; c.lineTo(x(swims.length - 1), H - B); c.lineTo(x(0), H - B); c.closePath(); c.fill();
  swims.forEach((s, i) => { if (s.pb) { c.fillStyle = '#ffd166'; c.beginPath(); c.arc(x(i), y(s.time), 4.5, 0, 7); c.fill(); } });
  // x labels: age
  c.fillStyle = '#5f7396'; c.textAlign = 'center'; let lastAge = null; swims.forEach((s, i) => { if (s.age !== lastAge) { lastAge = s.age; c.fillText('age ' + s.age, x(i), H - 10); } });
}

function shopItem(id) { for (const g of Object.values(SHOP)) { const it = g.items.find(i => i.id === id); if (it) return it; } return null; }
function owned(id) { return !!(G.gear && G.gear[id]); }
function gearMods() { // aggregated equipment effects
  const m = { race: 0, rt: 0, quality: 0, fit: 0, recov: 0, injury: 1, pressure: 1, attr: {}, prize: 1 };
  Object.keys(G.gear || {}).forEach(id => { const it = shopItem(id); if (!it || it.uses) return; m.race += it.race || 0; m.rt += it.rt || 0; m.quality += it.quality || 0; m.fit += it.fit || 0; m.recov += it.recov || 0; m.injury *= it.injury || 1; m.pressure *= it.pressure || 1; Object.entries(it.attr || {}).forEach(([k, v]) => m.attr[k] = (m.attr[k] || 0) + v); });
  (G.clubUpgrades && G.clubUpgrades[G.player.clubId] || []).forEach(id => { const u = CLUB_UPGRADES.find(x => x.id === id); if (!u) return; m.recov += u.recov || 0; m.pressure *= u.pressure || 1; m.prize *= u.prize || 1; });
  return m;
}
function bestSuit() { const s = Object.entries(G.gear || {}).map(([id, st]) => ({ it: shopItem(id), st })).filter(x => x.it && x.it.uses && x.st.uses > 0).sort((a, b) => b.it.tier - a.it.tier)[0]; return s || null; }
function buyItem(id) {
  const it = shopItem(id); if (!it) return; if ((G.money || 0) < it.price) { toast('Not enough money', 'red'); return; }
  if (it.once && owned(id)) return;
  G.money -= it.price; G.gear = G.gear || {}; G.gear[id] = it.uses ? { uses: it.uses, bought: dateStr(currentDate()) } : { bought: dateStr(currentDate()) };
  earn(0); G.ledger.unshift({ amt: -it.price, why: 'Bought ' + it.name, date: dateStr(currentDate()) });
  toast('Purchased: ' + it.name, 'green'); render();
}
function buyUpgrade(id) {
  const u = CLUB_UPGRADES.find(x => x.id === id); if (!u) return; const cid = G.player.clubId; G.clubUpgrades = G.clubUpgrades || {}; G.clubUpgrades[cid] = G.clubUpgrades[cid] || [];
  if (G.clubUpgrades[cid].includes(id)) return; if ((G.money || 0) < u.price) { toast('Not enough money', 'red'); return; }
  G.money -= u.price; G.clubUpgrades[cid].push(id); G.ledger = G.ledger || []; G.ledger.unshift({ amt: -u.price, why: 'Club upgrade: ' + u.name, date: dateStr(currentDate()) });
  addNews(`${clubOf(cid).name} unveils new ${u.name.toLowerCase()}`, `Funded by ${G.player.name}'s prize money. Coach: "This changes what we can do in training."`, 'aqua');
  toast('Club upgraded: ' + u.name, 'green'); render();
}

function isMasters(p) { return (p || G.player).age >= MASTERS_MIN_AGE; }
function mastersBandOf(age) { return MASTERS_BANDS.find(b => age >= b.min && age <= b.max) || null; }
function mastersWR(course, ev, bandId) { const b = MASTERS_BANDS.find(x => x.id === bandId); return wr(course, G.player.gender, ev).time * (b ? b.wr : 1.1); }

// records: G.mastersRecords[scope][course][band][ev] scope = world | national
function ensureMastersRecords() {
  if (G.mastersRecords) return; const p = G.player; const c = CTRY(p.nat); const rec = { world: {}, national: {} };
  ['LCM', 'SCM'].forEach(course => { rec.world[course] = {}; rec.national[course] = {}; MASTERS_BANDS.forEach(b => { rec.world[course][b.id] = {}; rec.national[course][b.id] = {}; EVENTS.forEach(e => {
    const w = mastersWR(course, e.id, b.id); const oc = R.pick(COUNTRIES);
    rec.world[course][b.id][e.id] = { time: w * (1 + Math.abs(R.n(0, 0.006))), holder: genName(oc.names, p.gender), country: oc.code, date: `${G.seasonYear - R.i(1, 10)}`, derived: true };
    rec.national[course][b.id][e.id] = { time: w * (MASTERS_STANDARDS.nationalRecord.ratio + Math.abs(R.n(0, 0.02)) + (1 - c.strength) * 0.05), holder: genName(c.names, p.gender), country: p.nat, date: `${G.seasonYear - R.i(1, 12)}`, derived: true };
  }); }); });
  G.mastersRecords = rec;
}
// masters competitor pool: per band, national + international
function ensureMastersPool() {
  const p = G.player; if (!G.pools.masters) G.pools.masters = [];
  const band = mastersBandOf(p.age); if (!band) return;
  const bands = MASTERS_BANDS.filter(b => Math.abs(b.min - band.min) <= 5); // player's band and neighbours
  bands.forEach(b => {
    const have = G.pools.masters.filter(s => mastersBandOf(s.age) && mastersBandOf(s.age).id === b.id);
    const quotaNat = 22, quotaIntl = 16;
    const nat = have.filter(s => s.nat === p.nat).length, intl = have.length - nat;
    for (let i = nat; i < quotaNat; i++) G.pools.masters.push(makeMastersEntry(p.nat, R.pick(CTRY(p.nat).regions), b, (i / quotaNat)));
    for (let i = intl; i < quotaIntl; i++) { const oc = R.pick(COUNTRIES.filter(x => x.code !== p.nat)); G.pools.masters.push(makeMastersEntry(oc.code, R.pick(oc.regions), b, (i / quotaIntl) * 0.8)); }
  });
}
function makeMastersEntry(nat, region, band, frac) {

  const base = band.wr * (1.02 + frac * 0.42); // from near-record to recreational

// ---------- 12. UNIVERSITY & NCAA ----------
function uniInfo() { G.uni = G.uni || { seasons: 0, ncaaSeasons: 0, offers: [], history: [] }; return G.uni; }
function currentUni() { const c = clubOf(G.player.clubId); return c && c.uni ? c : null; }
function isNCAA() { const c = currentUni(); return !!(c && c.ncaa); }
function evName(ev, course) { return course === 'SCY' && SCY_EVENT_LABEL[ev] ? SCY_EVENT_LABEL[ev] : EV(ev).name; }
function uniEligible(p) { p = p || G.player; return p.age >= UNI_MIN_AGE && p.age <= UNI_MAX_AGE; }
function scyFromLCM(ev, t) { return t * SCY_FACTORS[EV(ev).dist]; }

// Recruiting: offers are refreshed at the start of each season (and on demand) for 17–22 year olds
function refreshOffers() {
  const p = G.player; const u = uniInfo(); u.offers = [];
  if (!uniEligible(p) || (currentUni() && currentUni().ncaa)) return u.offers;
  const pr = primaryRatio(p);
  allClubs().filter(c => c.uni && !c.ncaa && c.country === p.nat && pr <= c.minRatio).forEach(c => u.offers.push({ id: c.id, kind: 'uni', scholarship: pr <= c.minRatio - 0.06 }));
  NCAA_SCHOOLS.forEach(c => { if (pr <= c.minRatio + 0.03) u.offers.push({ id: c.id, kind: 'ncaa', scholarship: pr <= c.minRatio - 0.02, walkOn: pr > c.minRatio }); });
  return u.offers;
}
function joinUniversity(id) {
  const c = clubOf(id); const p = G.player; if (!c || !c.uni) return;
  if (!uniEligible(p)) { toast('University eligibility is ages 17–22', 'red'); return; }
  const u = uniInfo(); if (c.ncaa && u.ncaaSeasons >= NCAA_SEASONS) { toast('NCAA eligibility used up (4 seasons)', 'red'); return; }
  const old = clubOf(p.clubId); p.clubId = id; p.phase = { type: 'plateau', weeks: 3 }; u.current = id; u.joinedSeason = G.seasonIndex; u.homeClubId = old.uni ? u.homeClubId : old.id;
  G.clubHistory.push({ clubId: id, from: `Season ${G.seasonIndex}`, season: G.seasonIndex }); u.history.push({ id, season: G.seasonIndex, ncaa: !!c.ncaa });
  G.clubmates = []; for (let i = 0; i < 12; i++) { const m = makeAgeGroupEntry(c.ncaa ? (R.chance(0.7) ? 'USA' : R.pick(COUNTRIES).code) : p.nat, c.region || p.region, R.i(18, 22), (c.minRatio >= 99 ? 1.25 : c.minRatio) + R.u() * 0.12 - 0.02, 'club'); refreshSeasonBests(m); G.clubmates.push(m); }
  ensureUniPools(); buildCalendar_keepEntries();
  addNews(c.ncaa ? `${p.name.split(' ')[0]} signs with ${c.name} (NCAA ${c.ncaa})` : `${p.name.split(' ')[0]} joins ${c.name}`, c.ncaa ? `${p.name} will swim ${c.conf} conference meets in yards and chase NCAA cuts. Coach: "${c.philosophy}"` : `${p.name} joins the varsity program. University Championships in ${G.seasonYear + 1}.`, 'gold');
  if (c.ncaa) unlock('ncaaSign');

}
function leaveUniversity(reason) {

  p.clubId = home.id; u.current = null; G.clubHistory.push({ clubId: home.id, from: `Season ${G.seasonIndex}`, season: G.seasonIndex });

// competitor pools
function ensureUniPools() {

  if (!G.pools.ncaa) { G.pools.ncaa = []; NCAA_SCHOOLS.forEach(sch => { const n = sch.div === 'D1' ? 9 : 6; for (let i = 0; i < n; i++) { const nat = R.chance(0.72) ? 'USA' : R.pick(COUNTRIES).code; const base = sch.div === 'D1' ? 1.035 : sch.div === 'D2' ? 1.11 : 1.19; const s = makeAgeGroupEntry(nat, R.pick(CTRY(nat).regions), R.i(18, 22), base + (i / n) * 0.11 + (sch.rep >= 5 ? -0.01 : 0), 'ncaa'); s.uniId = sch.id; s.div = sch.div; s.conf = sch.conf; refreshSeasonBests(s); G.pools.ncaa.push(s); } }); }
}

  ['uni', 'ncaa'].forEach(k => { if (!G.pools[k]) return; G.pools[k].forEach(s => { s.age++; EVENTS.forEach(e => { s.ab[e.id] = clamp(s.ab[e.id] - 0.008 + R.n(0, 0.006), 1.0, 2); }); refreshSeasonBests(s); }); G.pools[k] = G.pools[k].filter(s => s.age <= 22 || R.chance(0.15)); });
  if (G.pools.ncaa) NCAA_SCHOOLS.forEach(sch => { const n = sch.div === 'D1' ? 9 : 6; let have = G.pools.ncaa.filter(s => s.uniId === sch.id).length; for (; have < n; have++) { const nat = R.chance(0.72) ? 'USA' : R.pick(COUNTRIES).code; const base = sch.div === 'D1' ? 1.035 : sch.div === 'D2' ? 1.11 : 1.19; const s = makeAgeGroupEntry(nat, R.pick(CTRY(nat).regions), 18, base + R.u() * 0.11, 'ncaa'); s.uniId = sch.id; s.div = sch.div; s.conf = sch.conf; refreshSeasonBests(s); G.pools.ncaa.push(s); } });
  if (G.pools.uni) { const p = G.player; while (G.pools.uni.length < 34) { const s = makeAgeGroupEntry(p.nat, R.pick(CTRY(p.nat).regions), 18, 1.09 + R.u() * 0.25, 'uni'); s.uniId = R.pick(allClubs().filter(c => c.uni && !c.ncaa && c.country === p.nat)).id; refreshSeasonBests(s); G.pools.uni.push(s); } }
}

      <div class="panel"><h3>NCAA cuts & records (SCY)</h3>${ncaaTable()}</div>`;
  } else {
    body = `<div class="panel"><h1>University</h1><p class="sub mt8">${p.age < UNI_MIN_AGE ? `University recruiting opens at ${UNI_MIN_AGE} (${UNI_MIN_AGE - p.age} year(s) away). Domestic varsity programs take most swimmers; NCAA schools recruit by time — D3 around ${levelOf(1.28).label} level, D2 ${levelOf(1.19).label}, D1 ${levelOf(1.12).label}+.` : 'University eligibility has ended.'}</p>${u.history.length ? `<h3 class="mt">History</h3>${u.history.map(h => `<div class="goal done"><span class="box">✓</span>${esc(clubOf(h.id).name)} · from season ${h.season}${h.ncaa ? ' · NCAA' : ''}</div>`).join('')}` : ''}<h3 class="mt">NCAA records (SCY)</h3>${ncaaTable()}</div>`;
  }
  return body;
}

</script>
</body>
</html>
