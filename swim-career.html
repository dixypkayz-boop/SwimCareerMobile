<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050912">
<title>Swim Career — Swimming Career Mode</title>
<style>
/* ================= SWIM CAREER — UI ================= */
:root{
  --bg0:#050912; --bg1:#0b1426; --bg2:#101c33;
  --glass:rgba(16,28,52,.62); --glass2:rgba(22,38,70,.55); --line:rgba(120,170,255,.16); --line2:rgba(120,170,255,.32);
  --txt:#e9f1ff; --muted:#8ea3c7; --dim:#5f7396;
  --aqua:#39c6ff; --aqua2:#1fa3e6; --gold:#ffd166; --silver:#cfd8e6; --bronze:#d08c5a;
  --green:#5ef2a0; --red:#ff5c7a; --amber:#ffb347; --purple:#a67cff;
  --r:14px; --shadow:0 20px 60px rgba(0,0,0,.45), 0 0 0 1px var(--line);
  --font:'Segoe UI',system-ui,-apple-system,Roboto,Inter,Helvetica,Arial,sans-serif;
  --mono:'SF Mono',Consolas,'Roboto Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{font-family:var(--font);color:var(--txt);background:var(--bg0);overflow:hidden;font-size:15px;line-height:1.35;overscroll-behavior:none;height:100dvh}
body::before{content:'';position:fixed;inset:-12%;z-index:0;pointer-events:none;background-size:160% 160%,160% 160%,160% 160%,100% 100%;
  background:radial-gradient(1200px 700px at 15% -10%,rgba(57,198,255,.24),transparent 60%),
             radial-gradient(900px 600px at 110% 100%,rgba(166,124,255,.22),transparent 60%),
             radial-gradient(700px 520px at 80% 0%,rgba(255,209,102,.12),transparent 55%),
             linear-gradient(180deg,var(--bg1),var(--bg0));
  animation:auroraDrift 30s ease-in-out infinite alternate;}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.25;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.012) 3px 4px);}
@keyframes auroraDrift{0%{background-position:0 0,0 0,0 0,0 0}100%{background-position:5% -4%,-4% 5%,3% 3%,0 0}}
.bubbles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bubbles i{position:absolute;bottom:-40px;display:block;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(120,200,255,.08) 70%);border:1px solid rgba(255,255,255,.12);animation:bubbleUp linear infinite}
@keyframes bubbleUp{0%{transform:translateY(0) translateX(0);opacity:0}8%{opacity:.55}92%{opacity:.35}100%{transform:translateY(-115vh) translateX(var(--dx,20px));opacity:0}}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none;touch-action:manipulation}
input,select{font-family:inherit;color:var(--txt);background:rgba(8,16,32,.7);border:1px solid var(--line2);border-radius:8px;padding:9px 12px;font-size:14px;outline:none}
input:focus,select:focus{border-color:var(--aqua);box-shadow:0 0 0 3px rgba(57,198,255,.15)}
select option{background:#0d1a30}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(120,170,255,.2);border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* ---------- Layout ---------- */
.topbar{display:flex;align-items:center;gap:16px;padding:10px 22px;background:linear-gradient(90deg,rgba(9,18,36,.92),rgba(12,24,48,.75));border-bottom:1px solid var(--line);backdrop-filter:blur(14px);flex-shrink:0}
.brand{font-weight:900;letter-spacing:.14em;font-size:15px;color:#fff;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand span{background:linear-gradient(90deg,var(--aqua),var(--purple),var(--gold),var(--aqua));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite}
.nav{display:flex;gap:2px;margin-left:8px;flex-wrap:wrap}
.nav button{padding:8px 13px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.03em;transition:.18s;position:relative}
.nav button:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav button.active{color:#fff;background:linear-gradient(180deg,rgba(57,198,255,.22),rgba(57,198,255,.08));box-shadow:inset 0 -2px 0 var(--aqua)}
.nav button .badge{position:absolute;top:2px;right:4px;background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:0 5px;font-weight:800}
.topbar .who{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted)}
.topbar .who b{color:#fff}
.datechip{background:rgba(57,198,255,.12);border:1px solid var(--line2);padding:5px 10px;border-radius:8px;font-family:var(--mono);font-size:12px;color:#fff}
.main{flex:1;overflow:auto;padding:22px 26px 40px;scroll-behavior:smooth}
.screen{animation:fadeUp .35s ease both;max-width:1400px;margin:0 auto}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
@media(max-width:1000px){.g2,.g3,.g4,.g21,.g12{grid-template-columns:1fr}}

/* ---------- Panels ---------- */
.panel{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.25);position:relative;overflow:hidden;transition:border-color .2s,box-shadow .2s,transform .2s}
.panel::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.05),transparent 40%)}
.panel::after{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--aqua),var(--purple),var(--gold));opacity:.55;pointer-events:none}
@media(hover:hover){.panel:hover{border-color:var(--line2);box-shadow:0 14px 38px rgba(0,0,0,.32),0 0 0 1px rgba(120,170,255,.1)}}
.panel h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel h3 .r{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;font-size:12px}
.panel.hero{background:linear-gradient(135deg,rgba(20,46,90,.75),rgba(10,20,40,.8));border-color:var(--line2)}
h1{font-size:34px;font-weight:900;letter-spacing:-.01em;line-height:1.05}
h2{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:13px}
.big{font-size:40px;font-weight:900;font-family:var(--mono);letter-spacing:-.02em;line-height:1}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.aqua{color:var(--aqua)}.amber{color:var(--amber)}.purple{color:var(--purple)}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.center{justify-content:center}
.col{display:flex;flex-direction:column;gap:8px}
.mt{margin-top:14px}.mb{margin-bottom:14px}.mt8{margin-top:8px}
.sp{flex:1}
.tag{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.tag.gold{background:rgba(255,209,102,.15);border-color:rgba(255,209,102,.4);color:var(--gold)}
.tag.green{background:rgba(94,242,160,.12);border-color:rgba(94,242,160,.4);color:var(--green)}
.tag.red{background:rgba(255,92,122,.12);border-color:rgba(255,92,122,.4);color:var(--red)}
.tag.aqua{background:rgba(57,198,255,.12);border-color:rgba(57,198,255,.4);color:var(--aqua)}
.tag.purple{background:rgba(166,124,255,.15);border-color:rgba(166,124,255,.4);color:var(--purple)}
.tag.amber{background:rgba(255,179,71,.15);border-color:rgba(255,179,71,.4);color:var(--amber)}
.stars{color:var(--gold);letter-spacing:2px;font-size:12px}

/* ---------- Buttons ---------- */
.btn{padding:10px 18px;border-radius:10px;font-weight:700;font-size:13px;letter-spacing:.04em;background:rgba(255,255,255,.07);border:1px solid var(--line2);transition:.15s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,#39c6ff,#2b7dff);color:#03101f;border-color:transparent;box-shadow:0 8px 24px rgba(43,125,255,.35)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:linear-gradient(135deg,#ffd166,#f4a261);color:#2a1a00;border-color:transparent;box-shadow:0 8px 24px rgba(255,180,80,.3)}
.btn.danger{background:rgba(255,92,122,.15);border-color:rgba(255,92,122,.5);color:#ffb3c1}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn.lg{padding:14px 28px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.block{width:100%}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid rgba(120,170,255,.07)}
tr.me td{background:rgba(57,198,255,.1);font-weight:700}
tr.hover:hover td{background:rgba(255,255,255,.04)}
td.t,th.t{font-family:var(--mono);text-align:right}
.flag{font-size:16px;margin-right:4px}

/* ---------- Bars ---------- */
.bar{height:8px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--aqua2),var(--aqua));transition:width .5s ease}
.bar.gold i{background:linear-gradient(90deg,#f4a261,var(--gold))}
.bar.red i{background:linear-gradient(90deg,#c2334f,var(--red))}
.bar.green i{background:linear-gradient(90deg,#1fa36a,var(--green))}
.bar.purple i{background:linear-gradient(90deg,#6b48d8,var(--purple))}
.attr{display:grid;grid-template-columns:150px 1fr 38px;align-items:center;gap:10px;font-size:12px;padding:4px 0}
.attr b{font-family:var(--mono);text-align:right}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-size:22px;font-weight:800;font-family:var(--mono)}

/* ---------- Cards / lists ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid rgba(120,170,255,.08);transition:.15s}
.item:hover{background:rgba(255,255,255,.06);border-color:var(--line2)}
.item.sel{border-color:var(--aqua);background:rgba(57,198,255,.1)}
.item .ic{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;background:rgba(255,255,255,.08)}
.item .body{flex:1;min-width:0}
.item .body .t{font-weight:700}
.item .body .s{font-size:12px;color:var(--muted)}
.meet-card{border-left:4px solid var(--aqua)}
.goal{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.goal .box{width:18px;height:18px;border-radius:5px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px}
.goal.done .box{background:var(--green);border-color:var(--green);color:#03301a}
.goal.done{color:var(--muted);text-decoration:line-through}
.news{padding:10px 0;border-bottom:1px solid rgba(120,170,255,.08)}
.news .h{font-weight:700}
.news .d{font-size:11px;color:var(--dim);font-family:var(--mono)}
.news .b{font-size:13px;color:var(--muted);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--line2)}
.chip.on{background:rgba(57,198,255,.18);border-color:var(--aqua);color:#fff}
.chip.dis{opacity:.35;cursor:not-allowed}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv span:nth-child(odd){color:var(--dim)}

/* ---------- Calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cal .m{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:10px 8px;min-height:150px;display:flex;flex-direction:column;gap:5px;transition:.15s}
.cal .m.cur{border-color:var(--aqua);box-shadow:0 0 0 2px rgba(57,198,255,.2)}
.cal .m h4{font-size:11px;letter-spacing:.14em;text-align:center;color:var(--muted);margin-bottom:4px}
.cal .m.cur h4{color:var(--aqua)}
.cal .mt-{font-size:12px;padding:5px 6px;border-radius:6px;border-left:3px solid;background:rgba(255,255,255,.05);cursor:pointer;line-height:1.2;transition:.15s}
.cal .mt-:hover{background:rgba(255,255,255,.12)}
.cal .mt-.entered{background:rgba(94,242,160,.12);outline:1px solid rgba(94,242,160,.4)}
.cal .mt-.past{opacity:.35}
.cal .mt-.locked{opacity:.5;border-style:dashed}
.cal .wk{font-size:9px;color:var(--dim);display:flex;justify-content:space-between}
.cal .wkdot{display:flex;gap:2px;margin-top:auto;flex-wrap:wrap}
.cal .wkdot i{width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.08)}
.cal .wkdot i.done{background:rgba(57,198,255,.5)}.cal .wkdot i.now{background:var(--gold)}

/* ---------- Training ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.day h5{font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.day select{width:100%;font-size:12px;padding:6px}
.day .desc{font-size:11px;color:var(--muted);line-height:1.3}
.day .load{font-size:10px;font-family:var(--mono)}
.sess-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.sess{padding:9px 11px;border-radius:9px;background:rgba(255,255,255,.035);border:1px solid var(--line);font-size:12px}
.sess b{display:block;font-size:12px;margin-bottom:2px}
.sess i{color:var(--dim);font-style:normal;font-family:var(--mono);font-size:10px}
.fatigue-meter{display:flex;gap:16px;align-items:center}
.gauge{width:100%;height:14px;border-radius:8px;background:linear-gradient(90deg,#2bd47a 0,#ffd166 50%,#ff5c7a 100%);position:relative;opacity:.85}
.gauge i{position:absolute;top:-4px;width:4px;height:22px;background:#fff;border-radius:2px;box-shadow:0 0 8px #fff;transform:translateX(-2px)}

/* ---------- Race ---------- */
.race-wrap{position:fixed;inset:0;z-index:50;background:#020611;display:flex;flex-direction:column;animation:fadeUp .4s}
.race-top{display:flex;align-items:center;gap:14px;padding:8px 18px;background:linear-gradient(90deg,rgba(6,12,26,.95),rgba(10,22,44,.8));border-bottom:1px solid var(--line)}
.race-top .ev{font-weight:900;letter-spacing:.1em;font-size:14px}
.race-top .clock{margin-left:auto;font-family:var(--mono);font-size:26px;font-weight:800;color:#fff;letter-spacing:.02em;min-width:130px;text-align:right}
.race-top .clock small{font-size:11px;color:var(--muted);font-weight:500;display:block;letter-spacing:.12em}
.race-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas#race{width:100%;max-width:1400px;height:auto;aspect-ratio:16/9;display:block;border-radius:6px}
.race-hud{position:absolute;left:0;right:0;bottom:0;display:flex;gap:14px;align-items:flex-end;padding:14px 22px;pointer-events:none}
.race-hud > *{pointer-events:auto}
.hud-panel{background:rgba(6,14,30,.78);border:1px solid var(--line2);border-radius:12px;padding:10px 14px;backdrop-filter:blur(10px);min-width:150px}
.hud-panel h6{font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.effort{display:flex;gap:4px}
.effort i{width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;font-style:normal;cursor:pointer;transition:.1s}
.effort i.on{background:linear-gradient(180deg,#ffb347,#ff6b35);color:#200}
.effort i.on.e1,.effort i.on.e2{background:linear-gradient(180deg,#5ef2a0,#1fa36a);color:#031}
.effort i.on.e3{background:linear-gradient(180deg,#39c6ff,#2b7dff);color:#012}
.energy{height:10px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;width:180px}
.energy i{display:block;height:100%;background:linear-gradient(90deg,#ff5c7a,#ffd166,#5ef2a0);transition:width .1s linear}
.splits{font-family:var(--mono);font-size:12px;line-height:1.6;max-height:130px;overflow:auto;min-width:140px}
.splits div{display:flex;justify-content:space-between;gap:12px}
.prompt{position:absolute;left:50%;top:9%;transform:translateX(-50%);text-align:center;pointer-events:none}
.prompt:not(:empty){background:rgba(4,10,24,.55);border-radius:14px;padding:6px 22px 10px;backdrop-filter:blur(4px)}
.prompt .big-key{font-size:44px;font-weight:900;letter-spacing:.08em;text-shadow:0 0 30px rgba(57,198,255,.8);animation:pulse .5s infinite alternate}
.prompt .sub-key{font-size:13px;letter-spacing:.2em;color:var(--aqua);text-transform:uppercase}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}
.ring{width:110px;height:110px;margin:6px auto 0;border-radius:50%;border:4px solid rgba(255,255,255,.2);position:relative}
.ring i{position:absolute;inset:0;border-radius:50%;border:4px solid var(--aqua);transform:scale(var(--s,1));transition:none}
.feedback{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;letter-spacing:.06em;text-shadow:0 4px 24px rgba(0,0,0,.6);animation:fb .9s ease-out forwards;pointer-events:none}
@keyframes fb{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
.race-controls{position:absolute;right:22px;top:14px;display:flex;flex-direction:column;gap:6px}
.race-controls .btn{background:rgba(6,14,30,.7)}
.pos-board{position:absolute;right:22px;top:14px;background:rgba(6,14,30,.78);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font-size:12px;font-family:var(--mono);backdrop-filter:blur(10px);min-width:220px}
.pos-board div{display:flex;gap:8px;padding:2px 0}
.pos-board .me{color:var(--aqua);font-weight:800}
.pos-board .n{width:16px;color:var(--dim)}
.pos-board .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Cinematic intro */
.cine{position:fixed;inset:0;z-index:60;background:radial-gradient(1000px 600px at 50% 30%,#0e2a55,#020611 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;animation:fadeUp .5s}
.cine .kicker{letter-spacing:.4em;font-size:12px;color:var(--aqua);text-transform:uppercase;animation:slideIn .6s both}
.cine h1{font-size:52px;text-align:center;letter-spacing:.06em;text-transform:uppercase;animation:slideIn .7s .1s both;background:linear-gradient(180deg,#fff,#9dd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.cine .meetname{font-size:16px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;animation:slideIn .7s .2s both}
.cine .lanes{margin-top:20px;display:flex;flex-direction:column;gap:6px;min-width:520px}
.cine .lane{display:flex;align-items:center;gap:14px;padding:8px 16px;background:rgba(255,255,255,.05);border-left:3px solid var(--line2);animation:slideIn .5s both;font-size:15px}
.cine .lane.me{background:rgba(57,198,255,.16);border-left-color:var(--aqua)}
.cine .lane .ln{font-family:var(--mono);color:var(--dim);width:60px}
.cine .lane .nm{flex:1;font-weight:700}
.cine .lane .st{font-family:var(--mono);color:var(--muted)}
.cine .count{font-size:120px;font-weight:900;font-family:var(--mono);color:#fff;text-shadow:0 0 60px var(--aqua);animation:pulse .5s infinite alternate}
.cine .go{font-size:90px;font-weight:900;color:var(--green);letter-spacing:.2em;text-shadow:0 0 60px var(--green)}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.cine.olympic{background:radial-gradient(1200px 700px at 50% 20%,#3a1d7a,#020611 70%)}
.cine.olympic h1{background:linear-gradient(180deg,#fff,#ffd166);-webkit-background-clip:text;background-clip:text}
.cine .crowd{position:absolute;inset:0;pointer-events:none;opacity:.5;background:repeating-radial-gradient(circle at 50% 120%,rgba(255,255,255,.08) 0 2px,transparent 2px 14px)}

/* Results */
.result-hero{text-align:center;padding:30px 20px}
.result-hero .place{font-size:96px;font-weight:900;line-height:1;font-family:var(--mono)}
.result-hero .place.p1{color:var(--gold);text-shadow:0 0 50px rgba(255,209,102,.5)}
.result-hero .place.p2{color:var(--silver)}.result-hero .place.p3{color:var(--bronze)}
.result-hero .time{font-size:48px;font-family:var(--mono);font-weight:800}
.pbflash{display:inline-block;padding:8px 20px;border-radius:999px;background:linear-gradient(135deg,#ffd166,#ff8c42);color:#2a1200;font-weight:900;letter-spacing:.14em;animation:pulse .6s infinite alternate;margin-top:10px}
.recflash{display:inline-block;padding:10px 24px;border-radius:999px;background:linear-gradient(135deg,#a67cff,#39c6ff);color:#0a0020;font-weight:900;letter-spacing:.16em;animation:pulse .5s infinite alternate;margin-top:10px;font-size:16px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:170px;margin:16px 0}
.podium .p{width:150px;text-align:center;border-radius:10px 10px 0 0;padding-top:10px;font-weight:700;font-size:12px;display:flex;flex-direction:column;justify-content:flex-start;gap:4px}
.podium .p1{height:150px;background:linear-gradient(180deg,rgba(255,209,102,.35),rgba(255,209,102,.05))}
.podium .p2{height:115px;background:linear-gradient(180deg,rgba(207,216,230,.3),rgba(207,216,230,.04))}
.podium .p3{height:90px;background:linear-gradient(180deg,rgba(208,140,90,.3),rgba(208,140,90,.04))}
.podium .medal{font-size:26px}
.delta{font-family:var(--mono);font-weight:700}

/* Modal / toast */
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(2,6,17,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;animation:fadeUp .2s}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:26px 28px;min-width:420px;max-width:760px;max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.toasts{position:fixed;right:20px;top:70px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:rgba(12,24,48,.95);border:1px solid var(--line2);border-left:4px solid var(--aqua);padding:10px 14px;border-radius:10px;font-size:13px;min-width:260px;box-shadow:var(--shadow);animation:slideR .3s}
.toast.gold{border-left-color:var(--gold)}.toast.green{border-left-color:var(--green)}.toast.red{border-left-color:var(--red)}.toast.purple{border-left-color:var(--purple)}
@keyframes slideR{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.achv{position:fixed;left:50%;top:80px;transform:translateX(-50%);z-index:85;background:linear-gradient(135deg,#1a2f5c,#0d1a30);border:1px solid var(--gold);border-radius:14px;padding:14px 22px;display:flex;gap:14px;align-items:center;box-shadow:0 0 40px rgba(255,209,102,.3);animation:achv 4s forwards}
.achv .ic{font-size:30px}
.achv .t{font-size:10px;letter-spacing:.2em;color:var(--gold)}
.achv .n{font-weight:900;font-size:16px}
@keyframes achv{0%{opacity:0;transform:translate(-50%,-30px)}10%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}

/* Title screen */
.title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:5;background:radial-gradient(1000px 700px at 50% 100%,rgba(57,198,255,.25),transparent 60%),linear-gradient(180deg,#071022,#020611)}
.title .logo{font-size:64px;font-weight:900;letter-spacing:.1em;line-height:1;background:linear-gradient(180deg,#fff,#7cc9ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.title .logo small{display:block;font-size:14px;letter-spacing:.5em;color:var(--aqua);-webkit-text-fill-color:var(--aqua);margin-bottom:10px}
.title .water{position:absolute;bottom:0;left:0;right:0;height:35%;background:linear-gradient(180deg,transparent,rgba(43,125,255,.35));overflow:hidden}
.title .water::before,.title .water::after{content:'';position:absolute;left:-50%;width:200%;height:200%;top:0;border-radius:45%;background:rgba(57,198,255,.08);animation:wave 9s linear infinite}
.title .water::after{animation-duration:14s;opacity:.6;top:10%}
@keyframes wave{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.saves{display:flex;flex-direction:column;gap:8px;min-width:460px;position:relative;z-index:2}

/* Creation */
.create{max-width:1100px;margin:0 auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.form label input,.form label select{font-size:14px;letter-spacing:0;text-transform:none}
.form .full{grid-column:1/-1}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.swimmer-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px}
.avatar{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3d5c8f,#0d1a30);border:3px solid var(--aqua);display:flex;align-items:center;justify-content:center;font-size:52px;box-shadow:0 0 40px rgba(57,198,255,.35)}
.avatar.gold{border-color:var(--gold);box-shadow:0 0 40px rgba(255,209,102,.4)}
.level-pill{padding:4px 12px;border-radius:999px;font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:1px solid}

/* Charts */
canvas.chart{width:100%;height:260px;display:block}

/* Trophy room */
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.trophy{padding:14px 10px;border-radius:12px;text-align:center;background:rgba(255,255,255,.04);border:1px solid var(--line);transition:.2s}
.trophy.unlocked{background:linear-gradient(180deg,rgba(255,209,102,.16),rgba(255,209,102,.03));border-color:rgba(255,209,102,.5)}
.trophy .ic{font-size:34px;filter:grayscale(1);opacity:.3}
.trophy.unlocked .ic{filter:none;opacity:1}
.trophy .n{font-size:12px;font-weight:800;margin-top:6px}
.trophy .d{font-size:10px;color:var(--dim)}
.medal-row{display:flex;gap:18px}
.medal-row .m{text-align:center}.medal-row .m .c{font-size:28px;font-weight:900;font-family:var(--mono)}.medal-row .m .l{font-size:10px;letter-spacing:.14em;color:var(--dim)}

.kbd{display:inline-block;padding:2px 7px;border-radius:5px;background:rgba(255,255,255,.1);border:1px solid var(--line2);font-family:var(--mono);font-size:11px}
.helpbox{font-size:12px;color:var(--muted);line-height:1.6}
.countdown-days{font-size:12px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.hidden{display:none!important}
.progress-line{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px}
.progress-line .arrow{color:var(--dim)}
.loader{width:22px;height:22px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--aqua);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Race feel additions ---------- */
.prompt .big-key.small{font-size:30px}
.tbar{position:relative;width:340px;height:22px;margin:10px auto 4px;border-radius:11px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);overflow:hidden}
.tbar .z{position:absolute;top:0;bottom:0;right:0}
.tbar .z.y{background:rgba(255,209,102,.35)}
.tbar .z.g{background:rgba(94,242,160,.7)}
.tbar i{position:absolute;top:-3px;bottom:-3px;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 12px #fff}
.uwbar{position:relative;width:340px;height:18px;margin:10px auto 16px;border-radius:9px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}
.uwbar .z{position:absolute;top:0;bottom:0;border-radius:9px}
.uwbar .z.g{background:rgba(94,242,160,.6)}
.uwbar .z.r{background:rgba(255,92,122,.6)}
.uwbar i{position:absolute;top:-3px;bottom:-3px;width:6px;margin-left:-3px;background:#39c6ff;border-radius:3px;box-shadow:0 0 12px #39c6ff}
.uwbar span{position:absolute;top:20px;font-size:10px;color:var(--muted);font-family:var(--mono);transform:translateX(-50%)}
.uwbar span:first-of-type{transform:none}
.ticker{position:absolute;left:50%;bottom:150px;transform:translateX(-50%) translateY(10px);opacity:0;transition:.3s;background:rgba(6,14,30,.85);border:1px solid var(--line2);border-left:4px solid var(--aqua);padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;pointer-events:none;max-width:60%;white-space:nowrap}
.ticker.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ticker .gold{color:var(--gold)}.ticker .red{color:var(--red)}.ticker .green{color:var(--green)}
.slowmo-vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 160px rgba(57,198,255,.35);animation:pulse 1s infinite alternate}
.finish-overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(4,10,24,.86);border:1px solid var(--line2);border-radius:18px;padding:22px 36px;text-align:center;backdrop-filter:blur(8px);animation:fadeUp .35s;min-width:320px;pointer-events:none}
.fo-place{font-size:72px;font-weight:900;font-family:var(--mono);line-height:1}
.fo-place.p1{color:var(--gold)}.fo-place.p2{color:var(--silver)}.fo-place.p3{color:var(--bronze)}
.fo-time{font-size:36px;font-family:var(--mono);font-weight:800;margin:4px 0}
.fo-list{margin-top:12px;font-family:var(--mono);font-size:13px;text-align:left}
.fo-list div{display:flex;gap:12px;justify-content:space-between;padding:2px 0}
.fo-list .me{color:var(--aqua);font-weight:800}

/* ---------- Mobile / iPhone ---------- */
@media(max-width:860px){
  .topbar{padding:calc(8px + env(safe-area-inset-top)) 10px 6px;gap:6px;flex-wrap:wrap}
  .brand{font-size:13px}
  .nav{order:3;width:100%;margin-left:0;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:2px;max-width:100%}
  .nav::-webkit-scrollbar{display:none}
  .nav button{padding:8px 11px;font-size:12px;flex-shrink:0}
  .topbar .who{margin-left:0;flex:1;font-size:11px;gap:8px;justify-content:flex-end}
  .topbar .who span:first-child{display:none}
  .datechip{font-size:10px;padding:4px 7px}
  .main{padding:14px 12px calc(28px + env(safe-area-inset-bottom))}
  h1{font-size:24px}
  h2{font-size:18px}
  .big{font-size:30px}
  .panel{padding:14px 14px}
  .grid{gap:10px}
  input,select{font-size:16px}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
  table th,table td{white-space:nowrap}
  .cal{grid-template-columns:repeat(6,132px);overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
  .week{grid-template-columns:repeat(7,140px);overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
  .modal{min-width:0;width:92vw;max-width:92vw;padding:18px 16px;max-height:82vh}
  .btn{min-height:40px}
  .btn.sm{min-height:34px}
  .cine .lanes{min-width:0;width:92vw}
  .cine h1{font-size:30px}
  .cine .count{font-size:80px}
  .cine .go{font-size:56px}
  .race-top{padding:6px 10px;gap:8px;flex-wrap:wrap}
  .race-top .clock{font-size:19px;min-width:0}
  .race-top .ev{font-size:11px}
  .race-top .sub{display:none}
  .race-hud{flex-wrap:wrap;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
  .hud-panel{min-width:0;flex:1 1 46%;padding:8px 10px}
  .hud-panel h6{font-size:9px;margin-bottom:4px}
  .splits{max-height:64px;font-size:11px}
  .effort i{width:32px;height:32px;font-size:13px}
  .energy{width:100%}
  .pos-board{min-width:0;max-width:46vw;font-size:10px;padding:6px 8px}
  .mini-panel{width:88vw;left:50%;bottom:150px;padding:10px 14px 8px}
  .ticker{max-width:88vw;white-space:normal;text-align:center}
  .finish-overlay{min-width:0;width:84vw;padding:18px 20px}
  .fo-place{font-size:52px}
  .fo-time{font-size:26px}
  .mini-touch-steer{display:flex}
}
@media(max-width:420px){
  .nav button{padding:7px 9px;font-size:11px}
  .hud-panel{flex:1 1 100%}
  .cine h1{font-size:24px}
}
.mini-touch-steer{display:none;gap:14px;justify-content:center;margin-top:8px}
.mini-touch-steer button{width:52px;height:44px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid var(--line2);font-size:20px;font-weight:900;color:#fff;touch-action:manipulation}
.mini-touch-steer button:active{background:rgba(57,198,255,.3);border-color:var(--aqua)}
@media(pointer:coarse){.mini-touch-steer{display:flex}}

/* ---------- Name tags ---------- */
.ntag{display:inline-block;padding:3px 11px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;border:1px solid;vertical-align:middle;white-space:nowrap}
.ntag.sm{font-size:9.5px;padding:2px 8px}
.ntag.locked{filter:grayscale(1);opacity:.45}
.tt-grey{color:#b7c2d6;border-color:#5f7396;background:rgba(255,255,255,.05)}
.tt-aqua{color:#39c6ff;border-color:#39c6ff;background:rgba(57,198,255,.12);box-shadow:0 0 12px rgba(57,198,255,.25)}
.tt-bronze{color:#e0a070;border-color:#d08c5a;background:rgba(208,140,90,.15)}
.tt-silver{color:#e6ecf5;border-color:#cfd8e6;background:rgba(207,216,230,.12);box-shadow:0 0 12px rgba(207,216,230,.2)}
.tt-purple{color:#c9a8ff;border-color:#a67cff;background:rgba(166,124,255,.18);box-shadow:0 0 14px rgba(166,124,255,.35)}
.tt-gold{color:#2a1a00;border-color:#ffd166;background:linear-gradient(90deg,#ffd166,#ffb347,#ffe08a,#ffd166);background-size:300% 100%;animation:shimmer 3s linear infinite;box-shadow:0 0 16px rgba(255,209,102,.5)}
.tt-fire{color:#fff;border-color:#ff6b35;background:linear-gradient(90deg,#ff5c7a,#ff9f43,#ff5c7a);background-size:300% 100%;animation:shimmer 2.5s linear infinite;box-shadow:0 0 16px rgba(255,107,53,.5)}
.tt-team{color:#fff;border-color:#fff;background:linear-gradient(90deg,#d52b1e,#0b1e5c);box-shadow:0 0 14px rgba(255,255,255,.3)}
.tt-legend{color:#fff;border-color:#fff;background:linear-gradient(90deg,#a67cff,#39c6ff,#5ef2a0,#ffd166,#a67cff);background-size:400% 100%;animation:shimmer 3s linear infinite;box-shadow:0 0 22px rgba(166,124,255,.6);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tt-olympic{color:#0a0a20;border-color:#ffd166;background:linear-gradient(90deg,#0085c7,#f4c300,#000,#009f3d,#df0024,#0085c7);background-size:500% 100%;animation:shimmer 4s linear infinite;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
@keyframes shimmer{from{background-position:0 0}to{background-position:300% 0}}

/* ---------- Trophy room ---------- */
.trophy-hero{background:radial-gradient(800px 300px at 20% 0%,rgba(255,209,102,.18),transparent 60%),linear-gradient(135deg,rgba(20,46,90,.75),rgba(10,20,40,.85))}
.score-ring{width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--pct)*1%),rgba(255,255,255,.08) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 40px rgba(255,209,102,.25)}
.score-ring>div{width:106px;height:106px;border-radius:50%;background:#0d1a30;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring b{font-size:38px;font-family:var(--mono);line-height:1;color:var(--gold)}
.score-ring span{font-size:9px;letter-spacing:.2em;color:var(--dim);text-align:center;line-height:1.2;margin-top:4px}
.medal-shelf{display:flex;gap:18px;flex-wrap:wrap}
.medal-stack{text-align:center;padding:12px 18px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);min-width:120px;position:relative;overflow:hidden}
.medal-stack.gold{background:linear-gradient(180deg,rgba(255,209,102,.22),rgba(255,209,102,.03));border-color:rgba(255,209,102,.5)}
.medal-stack.silver{background:linear-gradient(180deg,rgba(207,216,230,.2),rgba(207,216,230,.03));border-color:rgba(207,216,230,.4)}
.medal-stack.bronze{background:linear-gradient(180deg,rgba(208,140,90,.22),rgba(208,140,90,.03));border-color:rgba(208,140,90,.5)}
.medal-stack.empty{opacity:.45}
.medal-stack .disc{font-size:38px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.medal-stack .cnt{font-size:32px;font-weight:900;font-family:var(--mono);line-height:1.1}
.medal-stack .lbl{font-size:9px;letter-spacing:.2em;color:var(--dim);margin-top:2px}
.shelf{display:flex;gap:12px;flex-wrap:wrap;padding:14px 12px 10px;border-radius:12px;background:linear-gradient(180deg,transparent 70%,rgba(255,255,255,.06) 70%,rgba(120,80,30,.35) 72%,rgba(60,40,15,.5));border-bottom:6px solid rgba(120,80,30,.6)}
.trophy-big{width:150px;text-align:center;padding:10px 8px;border-radius:10px;background:rgba(255,255,255,.04)}
.trophy-big .cup{font-size:46px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.6));animation:pulse 2.4s infinite alternate}
.trophy-big.nat .cup,.trophy-big.world .cup,.trophy-big.oly .cup{filter:drop-shadow(0 0 14px rgba(255,209,102,.7))}
.trophy-big.oly{background:linear-gradient(180deg,rgba(166,124,255,.25),rgba(255,209,102,.08));border:1px solid rgba(255,209,102,.5)}
.trophy-big.world{background:linear-gradient(180deg,rgba(57,198,255,.2),transparent);border:1px solid rgba(57,198,255,.4)}
.trophy-big.nat{background:linear-gradient(180deg,rgba(255,209,102,.2),transparent);border:1px solid rgba(255,209,102,.4)}
.trophy-big.prov{border:1px solid rgba(166,124,255,.35)}
.trophy-big .tn{font-size:11px;font-weight:800;line-height:1.25;margin-top:4px}
.trophy-big .td{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.empty-shelf{display:flex;gap:16px;align-items:center;padding:16px;border-radius:12px;border:1px dashed var(--line2);color:var(--muted);font-size:13px}
.empty-shelf .cup{font-size:40px;opacity:.3;filter:grayscale(1)}
.podium-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pod-item{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.big-medal{font-size:28px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.tags-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.tagcard{padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--line);cursor:default;transition:.15s}
.tagcard.on{cursor:pointer}.tagcard.on:hover{background:rgba(255,255,255,.07);transform:translateY(-1px)}
.tagcard.eq{border-color:var(--aqua);background:rgba(57,198,255,.08)}
.tagcard .how{font-size:11px;color:var(--dim);margin-top:6px}
.best-swim{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(120,170,255,.08)}
.best-swim .rank{width:26px;height:26px;border-radius:50%;background:rgba(255,209,102,.15);color:var(--gold);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.best-swim .big-t{font-size:18px;font-weight:800;margin-left:auto}
.trophy{position:relative}
.trophy .rar{position:absolute;top:6px;right:8px;font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.trophy.rare.unlocked{border-color:rgba(57,198,255,.6);background:linear-gradient(180deg,rgba(57,198,255,.18),rgba(57,198,255,.03));box-shadow:0 0 18px rgba(57,198,255,.2)}
.trophy.rare.unlocked .rar{color:var(--aqua)}
.trophy.epic.unlocked{border-color:rgba(166,124,255,.7);background:linear-gradient(180deg,rgba(166,124,255,.22),rgba(166,124,255,.03));box-shadow:0 0 22px rgba(166,124,255,.3)}
.trophy.epic.unlocked .rar{color:var(--purple)}

.lanebar{position:relative;height:18px;border-radius:6px;background:rgba(19,135,211,.5);overflow:hidden}

.pbar .band{position:absolute;top:0;bottom:0;background:rgba(94,242,160,.45);border-radius:8px}
.pbar i{position:absolute;top:-3px;bottom:-3px;width:6px;margin-left:-3px;background:#ffb347;border-radius:3px;box-shadow:0 0 10px #ffb347}

.mini-panel{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);width:420px;background:rgba(6,14,30,.86);border:2px solid var(--line2);border-radius:14px;padding:12px 18px 10px;backdrop-filter:blur(10px);pointer-events:none;transition:.2s;opacity:.85}

function internationalMeetForYear(year){
  if (year % 4 === 0) return { name:'Olympic Games', kind:'olympics', stars:5, crowd:5, venue:'Olympic Aquatics Stadium', entry:'olympicB' };

}

  if (G && G.records && G.records.world && G.records.world[course] && G.records.world[course][ev]) return G.records.world[course][ev];
  if (course === 'SCY') { const r = NCAA_RECORDS[gender][ev]; if (r) return r; return { time: WORLD_RECORDS.LCM[gender][ev].time * SCY_FACTORS[EV(ev).dist] * 0.98, holder: '—', country: 'USA', date: '' }; }
  return WORLD_RECORDS[course][gender][ev];

function toLCM(time, course, ev) { return course === 'LCM' ? time : time / courseFactor(course, ev); }

// ---------- STANDARDS ----------
function standardTime(tier, ev, course, gender, age, seasonYear, country) {
  const ct = CTRY(country); const tdef = STANDARD_TIERS[tier]; if (!tdef) return null;
  const ag = ageGroupOf(age);
  const aged = AGE_GROUP_TIERS.includes(tier);
  const key = [country, seasonYear, gender, course, aged ? ag.id : 'open', tier, ev].join('|');
  if (STANDARD_OVERRIDES[key]) return STANDARD_OVERRIDES[key];
  let ratio = tdef.ratio + (EVENT_STANDARD_ADJ[ev] || 0) + STANDARD_SEASON_DRIFT * (seasonYear - 2026);
  if (aged) ratio += ag.add;
  if (!tdef.universal) ratio += (1 - ct.strength) * FEDERATION_STANDARD_FACTOR;
  return wr(course, gender, ev).time * ratio;
}

// ---------- 2. SWIMMER MODEL & DEVELOPMENT ----------
const ATTR_LIST = [
  ['speed', 'Speed'], ['start', 'Start'], ['underwater', 'Underwater'], ['turn', 'Turns'], ['technique', 'Stroke Technique'],
  ['endurance', 'Endurance'], ['sprintEnd', 'Sprint Endurance'], ['recovery', 'Recovery'], ['raceIQ', 'Race IQ'],
  ['free', 'Freestyle'], ['back', 'Backstroke'], ['breast', 'Breaststroke'], ['fly', 'Butterfly'], ['im', 'IM'],
];

// Expected ability ratio at a given age for a talent profile (hidden development curve)
function curveRatio(talent, ev, age) {
  const pot = talent.pot[ev];
  if (age < talent.peakAge) return pot + talent.k * Math.pow(talent.peakAge - age, 1.6);
  return pot + 0.004 * Math.pow(age - talent.peakAge, 1.2);
}

function makeTalent(events, primary, age, primaries) {
  primaries = primaries || [primary];
  const base = clamp(R.n(0.085, 0.05), 0.015, 0.30);        // 1.5% .. 30% off WR at peak
  const peakAge = clamp(Math.round(R.n(23.5, 2)), 20, 28);
  const k = 0.0071 * clamp(R.n(1, 0.15), 0.75, 1.35);        // growth steepness
  const strokeBias = {}; ['free', 'back', 'breast', 'fly', 'im'].forEach(s => strokeBias[s] = clamp(R.n(0.05, 0.03), 0, 0.14));
  const distBias = R.n(0, 0.03); // + favours sprint (short events penalised less)
  const pot = {};
  EVENTS.forEach(e => {
    let p = 1 + base + strokeBias[e.stroke];
    if (events.includes(e.id)) p -= 0.03;
    if (primaries.includes(e.id)) p -= 0.02;
    const distIdx = Math.log2(e.dist / 50); // 0..4.9
    p += distBias * (distIdx - 2) * 0.5;
    p += R.n(0, 0.008);
    pot[e.id] = clamp(p, 1.0, 1.6);
  });
  return { pot, peakAge, k, consistency: clamp(R.n(1, 0.25), 0.5, 1.6), injuryProne: clamp(R.n(1, 0.3), 0.4, 2), base };
}

function createSwimmer(f) {
  f.primaries = f.primaries && f.primaries.length ? f.primaries : [f.primary]; f.primary = f.primaries[0];
  const attrs = {}; ATTR_LIST.forEach(([k]) => attrs[k] = clamp(Math.round(R.n(38 + (f.age - 12) * 2.2, 6)), 12, 70));
  f.events.forEach(id => { const s = EV(id).stroke; attrs[s] = clamp(attrs[s] + 8, 0, 80); });
  if (EV(f.primary).dist <= 100) { attrs.speed += 6; attrs.sprintEnd += 4; } else if (EV(f.primary).dist >= 400) { attrs.endurance += 8; }
  const talent = makeTalent(f.events, f.primary, f.age, f.primaries);
  const ab = {};
  const ageNorm = f.age >= 12 ? 1.50 - (f.age - 12) * 0.045 : 1.50 + (12 - f.age) * 0.095; // typical club swimmer of this age (primary event)
  EVENTS.forEach(e => {
    let r = curveRatio(talent, e.id, f.age) + clamp(R.n(0.06, 0.02), 0.015, 0.12);
    const norm = ageNorm + (f.events.includes(e.id) ? 0 : 0.06) + (f.primaries.includes(e.id) ? -0.02 : 0);
    ab[e.id] = clamp(r, norm - 0.10, norm + 0.10); // talent shows over time, not on day one

    name: f.name, gender: f.gender, nat: f.nat, region: f.region, clubId: f.clubId, dob: f.dob, height: f.height, age: f.age,
    events: f.events, primary: f.primary, primaries: f.primaries, attrs, ab, talent,
    fatigue: 20, fitness: 45, form: 0, phase: { type: 'growth', weeks: 8 }, injury: null,
    pbs: {}, sb: {}, weeksTrained: 0, retired: false, capNumber: null,
  };
}

// Effective ability time in a course (what a perfectly executed, fresh race would produce)
function abilityTime(p, ev, course) {
  const e = EV(ev); const base = p.ab[ev] * wr('LCM', p.gender, ev).time * courseFactor(course, ev);
  const attrMod = 1 - (p.attrs[e.stroke] - 50) * 0.00025 - (p.attrs.technique - 50) * 0.00012;
  return base * attrMod;
}
function abilityRatio(p, ev) { return abilityTime(p, ev, 'LCM') / wr('LCM', p.gender, ev).time; }
function primaryRatio(p) { return Math.min(...p.events.map(e => abilityRatio(p, e))); }
function primariesOf(p) { return p.primaries && p.primaries.length ? p.primaries : [p.primary]; }

function eventCategory(ev) { const d = EV(ev).dist; return d <= 100 ? 'sprint' : d <= 200 ? 'mid' : 'dist'; }

// Quality of the week's training for a specific event (0.3 .. 1.4)
function weekQuality(plan, ev, club) {
  const e = EV(ev); const cat = eventCategory(ev); let q = 0.30;
  plan.forEach(id => {
    const s = SESSIONS[id]; if (!s) return;
    q += (s.q.all || 0) + (s.q[cat] || 0);
    if (s.q.stroke && G.player.events.some(pe => EV(pe).stroke === e.stroke)) q += s.q.stroke;
    if (s.q.im && e.stroke === 'im') q += s.q.im;
  });
  // club influence
  const spec = club.spec; const strokeSpec = e.stroke === 'im' ? spec.im : spec[e.stroke];
  const catSpec = cat === 'sprint' ? spec.sprint : cat === 'dist' ? spec.distance : (spec.sprint + spec.distance) / 2;
  q *= 0.80 + club.dev / 400 + (strokeSpec - 50) / 500 + (catSpec - 50) / 700;
  q *= 1 + gearMods().quality;
  return clamp(q, 0.25, 1.5);
}

function applyTrainingWeek() {
  const p = G.player; const club = clubOf(p.clubId); const plan = G.training.plan;
  let load = 0, fit = 0; const attrGain = {};
  if (p.injury) { // injured: rest only
    load = -18; fit = -1.5;
  } else {
    plan.forEach(id => {
      const s = SESSIONS[id]; if (!s) return; load += s.load; fit += s.fit;
      Object.entries(s.attr).forEach(([k, v]) => { if (k === 'STROKE') { const prs = p.primaries || [p.primary]; prs.forEach(pe => { const key = EV(pe).stroke; attrGain[key] = (attrGain[key] || 0) + v / prs.length; }); } else attrGain[k] = (attrGain[k] || 0) + v; });
    });
  }
  // fatigue dynamics: recover ~28% per week + load (recovery attr helps)
  const gm = gearMods();
  const recov = 0.26 + (p.attrs.recovery - 50) * 0.002 + gm.recov;
  p.fatigue = clamp(p.fatigue * (1 - recov) + load * 0.27 * (1.05 - club.dev / 500), 0, 100);
  p.fitness = clamp(p.fitness + fit * 0.55 * (1 + gm.fit) * (0.8 + club.dev / 300) * (1 - p.fitness / 105) - 1.6, 0, 100);
  if (!p.injury) Object.entries(gm.attr).forEach(([k, v]) => { const key = k === 'STROKE' ? EV(p.primary).stroke : k; attrGain[key] = (attrGain[key] || 0) + v; });
  // attributes (diminishing returns; young swimmers gain faster)
  const youth = p.age < 18 ? 1.25 : p.age < 22 ? 1 : p.age < 27 ? 0.7 : 0.4;
  Object.entries(attrGain).forEach(([k, v]) => { if (p.attrs[k] == null) return; p.attrs[k] = clamp(p.attrs[k] + v * 0.55 * youth * (1 - p.attrs[k] / 100) * (0.85 + club.dev / 400), 0, 99); });
  // overtraining / injury
  const risk = p.fatigue > 85 ? 0.09 : p.fatigue > 72 ? 0.035 : p.fatigue > 60 ? 0.008 : 0.002;
  if (!p.injury && R.chance(risk * p.talent.injuryProne * gm.injury)) {
    const inj = R.pick([['Shoulder impingement', 3], ['Lower back strain', 2], ['Knee (breaststroker\'s) pain', 3], ['Illness – flu', 1], ['Ear infection', 1], ['Rotator cuff irritation', 4]]);
    p.injury = { name: inj[0], weeks: inj[1] + (p.fatigue > 85 ? 1 : 0) };
    addNews('Injury setback', `${p.name} has been sidelined with ${inj[0].toLowerCase()} — out for about ${p.injury.weeks} weeks. Coach ${club.coach.split(' ')[1]}: "We pushed too hard. Rest now."`, 'red');
  }
  // form random walk
  p.form = clamp(p.form * 0.75 + R.n(0, 0.35), -1, 1);
  p.weeksTrained++;
  // development
  developWeek(p, plan, club);
  if (p.injury) { p.injury.weeks--; if (p.injury.weeks <= 0) { addNews('Back in the water', `${p.name} has recovered from ${p.injury.name.toLowerCase()} and returns to full training.`, 'green'); p.injury = null; } }
}

function developWeek(p, plan, club) {
  // phase state machine: growth / plateau / slump / breakthrough
  p.phase.weeks--;
  if (p.phase.weeks <= 0) {
    const r = R.u();
    const next = r < 0.42 ? 'growth' : r < 0.78 ? 'plateau' : r < 0.9 ? 'slump' : 'breakthrough';
    p.phase = { type: next, weeks: next === 'breakthrough' ? 1 : R.i(4, 12) };
    if (next === 'slump') addNews('Rough patch', `${p.name} is grinding through a slump — times in training have gone backwards. Coach says: "Trust the process."`, '');
    if (next === 'breakthrough') addNews('Something clicked', `A breakthrough week in training for ${p.name}. Everything feels faster.`, 'gold');
  }
  const mult = { growth: 1.3, plateau: 0.25, slump: -0.2, breakthrough: 3.0 }[p.phase.type];
  const log = {};
  EVENTS.forEach(e => {
    const q = (p.injury ? 0.15 : weekQuality(plan, e.id, club)) * (0.35 + p.fitness / 100 * 0.75) * (p.fatigue > 80 ? 0.7 : 1);
    const target = curveRatio(p.talent, e.id, p.age + 0.5);
    const gap = p.ab[e.id] - target;
    let dr;
    if (gap > 0) dr = -gap * 0.06 * q * mult;
    else dr = -gap * 0.012; // ahead of curve: slow drift back
    if (p.phase.type === 'slump') dr = Math.abs(gap) * 0.01 + 0.0006;
    if (p.phase.type === 'breakthrough') dr = -clamp(R.n(0.010, 0.004), 0.004, 0.02) * (q > 0.6 ? 1 : 0.4);
    dr += R.n(0, 0.0007);
    if (p.fitness < 30) dr += 0.0008; // detraining
    const before = p.ab[e.id];
    if (!isFinite(dr)) dr = 0;
    p.ab[e.id] = clamp(before + dr, p.talent.pot[e.id] - 0.02, 2.2);
    if (!isFinite(p.ab[e.id])) p.ab[e.id] = isFinite(before) ? before : 1.4;
    log[e.id] = (p.ab[e.id] - before) * wr('LCM', p.gender, e.id).time; // seconds
  });
  G.trainingLog.unshift({ week: G.week, season: G.seasonIndex, log, phase: p.phase.type });
  if (G.trainingLog.length > 60) G.trainingLog.pop();
}

// Race-day condition multiplier (fatigue, taper, form, pressure, variance)
function raceCondition(p, meet, round) {
  let m = 1;
  m += p.fatigue * 0.00038;                                   // up to +3.8% when destroyed
  const taper = p.fatigue < 22 && p.fitness > 55 ? 0.0065 * (p.fitness / 100) * (1 - p.fatigue / 22) : 0;
  m -= taper;
  m -= p.form * 0.0035;
  m += (50 - p.fitness) * 0.00012;                            // low fitness hurts
  const pressure = MEET_TIERS[meet.tier].pressure * (round === 'final' ? 1.2 : 1) * gearMods().pressure;
  m += R.n(0, 0.0025 * pressure * (1 - p.attrs.raceIQ / 140)); // nerves cut both ways
  m += R.n(0, 0.0045) * p.talent.consistency;                  // day-to-day variance
  if (p.injury) m += 0.012;
  if (R.chance(0.03 * pressure) && taper > 0.003) m -= 0.007;  // taper breakthrough
  if (R.chance(0.04 * pressure)) m += 0.009;                   // choke / bad swim
  return { mult: clamp(m, 0.975, 1.06), taper, pressure };
}


// ---------- 3. WORLD: POOLS, RIVALS, RECORDS, NEWS, ACHIEVEMENTS, RANKINGS ----------
function makePoolEntry(nat, region, ratioOffset, ageRange, tier) {
  const c = CTRY(nat); const ag = R.i(ageRange[0], ageRange[1]);
  const talent = { pot: {}, peakAge: clamp(Math.round(R.n(24, 2)), 20, 28), k: 0.0071 * clamp(R.n(1, .15), .75, 1.35) };
  // build a stroke profile: strong in 1-2 strokes
  const strokes = ['free', 'back', 'breast', 'fly', 'im']; const main = R.pick(strokes); const second = R.pick(strokes);
  const distBias = R.n(0, 0.03);
  EVENTS.forEach(e => {
    let p = 1 + ratioOffset + (e.stroke === main ? 0 : e.stroke === second ? 0.035 : 0.09) + distBias * (Math.log2(e.dist / 50) - 2) * 0.5 + R.n(0, 0.01);
    talent.pot[e.id] = clamp(p, 0.995, 1.8);
  });
  const ab = {}; EVENTS.forEach(e => ab[e.id] = curveRatio(talent, e.id, ag) + clamp(R.n(0.03, 0.015), 0, 0.08));
  return { id: uid(), name: genName(c.names, G.player.gender), nat, region, age: ag, ab, talent, main, tier, sb: {}, isRival: false };
}
function refreshSeasonBests(entry) { entry.sb = {}; EVENTS.forEach(e => entry.sb[e.id] = entry.ab[e.id] * (1 + Math.abs(R.n(0, 0.006)))); }
// Age-group swimmer whose CURRENT primary-event ratio is ~targetRatio; talent potential is back-solved so they develop believably
function makeAgeGroupEntry(nat, region, age, targetRatio, tier) {
  const s = makePoolEntry(nat, region, 0.05, [age, age], tier);
  const strokes = ['free', 'back', 'breast', 'fly', 'im']; const distBias = R.n(0, 0.03);
  EVENTS.forEach(e => {
    const off = (e.stroke === s.main ? 0 : R.chance(0.35) ? 0.035 : 0.09) + distBias * (Math.log2(e.dist / 50) - 2) * 0.5 + R.n(0, 0.012);
    s.ab[e.id] = clamp(targetRatio + off, 1.0, 2.4);
    s.talent.pot[e.id] = clamp(s.ab[e.id] - 0.04 - s.talent.k * Math.pow(Math.max(0, s.talent.peakAge - age), 1.6), 0.995, 1.8);
  });
  return s;
}
const POOL_QUOTA = { provincial: { '10&U': 28, '11-12': 30, '13-14': 30, '15-16': 30, '17-18': 26, open: 22 }, national: { '10&U': 14, '11-12': 22, '13-14': 26, '15-16': 26, '17-18': 26, open: 44 } };
function agRandomAge(gid) { const g = AGE_GROUPS.find(x => x.id === gid); return gid === '10&U' ? R.i(8, 10) : gid === 'open' ? R.i(19, 28) : R.i(g.min, g.max); }
function poolTargetRatio(kind, gid, ev, i, n) {
  const p = G.player; const c = CTRY(p.nat);
  if (gid === 'open') { const natBase = 0.004 + (1 - c.strength) * 0.11; return kind === 'national' ? 1 + natBase + i * 0.0045 : 1.09 + i * 0.012; }
  const base = standardTime(kind === 'national' ? 'juniorNational' : 'provincial', ev, 'LCM', p.gender, AGE_GROUPS.find(x => x.id === gid).max, G.seasonYear, p.nat) / wr('LCM', p.gender, ev).time;
  return base - 0.07 + (i / n) * 0.24;
}
function fillAgeGroup(kind, gid, region, list) {
  const quota = POOL_QUOTA[kind][gid]; const have = list.filter(s => ageGroupOf(s.age).id === gid && (kind === 'national' || s.region === region)).length;
  for (let i = have; i < quota; i++) { const age = agRandomAge(gid); const reg = kind === 'national' ? R.pick(CTRY(G.player.nat).regions) : region; const s = gid === 'open' && kind === 'national' ? makePoolEntry(G.player.nat, reg, poolTargetRatio(kind, gid, '100FR', i, quota) - 1, [19, 28], kind) : makeAgeGroupEntry(G.player.nat, reg, age, poolTargetRatio(kind, gid, '100FR', i, quota), kind); refreshSeasonBests(s); list.push(s); }
}

function buildWorld() {
  const p = G.player; const c = CTRY(p.nat); G.usedNames = G.usedNames || {};
  const others = COUNTRIES.filter(x => x.code !== p.nat);
  const world = [], national = [], provincial = [];
  // world pool: 80 senior swimmers, top of the sport
  for (let i = 0; i < 80; i++) { const oc = R.pick(others); world.push(makePoolEntry(oc.code, R.pick(oc.regions), 0.004 + i * 0.0012 + (1 - oc.strength) * 0.03, [18, 29], 'world')); }
  // national & provincial pools by age group
  AGE_GROUPS.forEach(g => { fillAgeGroup('national', g.id, null, national); fillAgeGroup('provincial', g.id, p.region, provincial); });
  // rivals: 3 same-age swimmers in region, similar level
  const rivals = [];
  for (let i = 0; i < 3; i++) {
    const r = makePoolEntry(p.nat, i < 2 ? p.region : R.pick(c.regions), 0, [p.age - 1, p.age + 1], 'rival');
    r.talent = makeTalent(p.events, p.primary, p.age, p.primaries); r.talent.pot = {};
    EVENTS.forEach(e => { r.talent.pot[e.id] = clamp(p.talent.pot[e.id] + R.n(0.01, 0.04) + (p.events.includes(e.id) ? 0 : 0.03), 1.0, 1.7); });
    r.talent.peakAge = clamp(Math.round(R.n(23.5, 2)), 20, 28); r.talent.k = 0.0071 * clamp(R.n(1, .15), .75, 1.35);
    EVENTS.forEach(e => r.ab[e.id] = clamp(curveRatio(r.talent, e.id, r.age) + clamp(R.n(0.06, 0.02), 0.01, 0.12), p.ab[e.id] - 0.08, p.ab[e.id] + 0.10));
    r.isRival = true; r.phase = { type: 'growth', weeks: 6 }; const rr = Math.min(...p.events.map(e => r.ab[e])); const okClubs = allClubs().filter(k => k.country === p.nat && k.region === r.region && k.minRatio >= rr); r.clubId = i === 0 ? p.clubId : R.pick(okClubs.length ? okClubs : allClubs().filter(k => k.country === p.nat && k.minRatio >= 99)).id;
    rivals.push(r);
  }

  // clubmates

  buildRecords();
}

function buildRecords() {
  const p = G.player; const c = CTRY(p.nat); const yr = G.seasonYear;
  const rec = { national: {}, regional: {}, worldJunior: {}, ageGroup: {}, meet: {} };
  ['LCM', 'SCM', 'SCY'].forEach(course => {

    EVENTS.forEach(e => {

      rec.regional[course][e.id] = { time: w * (natR + DERIVED_RECORD_RATIOS.regional + Math.abs(R.n(0, 0.01))), holder: genName(c.names, p.gender), country: p.nat, date: `${yr - R.i(1, 15)}-0${R.i(1, 9)}-0${R.i(1, 9)}`, derived: true };

function meetRecord(meet, ev) {

  if (!G.records.meet[key]) {
    const band = mastersBandOf ? mastersBandOf(G.player.age) : null; const tierR = { club: 1.35, dual: 1.35, invite: 1.28, regional: 1.22, provincial: 1.14, juniorNational: 1.08, national: 1.04, trials: 1.035, worldcup: 1.02, international: 1.005, intlInvite: 1.03, mastersClub: (band ? band.wr : 1.1) + 0.25, mastersProv: (band ? band.wr : 1.1) + 0.15, mastersNat: (band ? band.wr : 1.1) + 0.06, mastersWorld: (band ? band.wr : 1.1) + 0.01 }[meet.tier] || 1.2;

// Yearly progression of AI swimmers
function progressPools() {
  const all = [...G.pools.world, ...G.pools.national, ...G.pools.provincial, ...G.clubmates];
  all.forEach(s => { s.age++; EVENTS.forEach(e => { const t = curveRatio(s.talent, e.id, s.age); s.ab[e.id] = lerp(s.ab[e.id], t + 0.02, 0.6) + R.n(0, 0.006); }); refreshSeasonBests(s); });
  // retirements
  G.pools.world = G.pools.world.map(s => { if (s.age > 31 || (s.age > 27 && R.chance(0.12))) { const fresh = makePoolEntry(s.nat, s.region, 0.02 + R.u() * 0.05, [17, 20], 'world'); refreshSeasonBests(fresh); return fresh; } return s; });
  ['national', 'provincial'].forEach(k => { G.pools[k] = G.pools[k].filter(s => !(s.age > 31 || (s.age > 26 && R.chance(0.15)) || (k === 'provincial' && s.age > 21 && R.chance(0.3)))); });
  // top up every age group; trim overpopulated groups (slowest drop out)
  ['national', 'provincial'].forEach(k => {

function playerSeasonBest(ev) { // LCM-equivalent ratio
  let best = null;
  ['LCM', 'SCM', 'SCY'].forEach(c => { const k = ev + '|' + c + '|' + G.seasonIndex; if (G.player.sb[k] != null) { const r = toLCM(G.player.sb[k], c, ev) / wr('LCM', G.player.gender, ev).time; if (best == null || r < best) best = r; } });
  return best;
}
function rankingList(ev, scope) {
  const p = G.player; let list = []; const g = ageGroupOf(p.age);
  const add = (arr, tag) => arr.forEach(s => list.push({ name: s.name, nat: s.nat, region: s.region, age: s.age, ratio: s.sb[ev], tag, isRival: s.isRival, clubId: s.clubId, pool: tag }));
  if (scope === 'world') { add(G.pools.world, 'pool'); add(G.pools.national.filter(s => ageGroupOf(s.age).id === 'open'), 'pool'); add(G.rivals, 'x'); }
  if (scope === 'national') { add(G.pools.national, 'pool'); add(G.pools.provincial, 'pool'); add(G.rivals, 'x'); }
  if (scope === 'age') { add([...G.pools.national, ...G.pools.provincial].filter(s => ageGroupOf(s.age).id === g.id), 'pool'); add([...G.rivals, ...G.clubmates].filter(s => ageGroupOf(s.age).id === g.id), 'x'); }
  if (scope === 'regional') { add([...G.pools.provincial, ...G.pools.national.filter(s => s.region === p.region)].filter(s => ageGroupOf(s.age).id === g.id), 'pool'); add([...G.rivals.filter(r => r.region === p.region), ...G.clubmates].filter(s => ageGroupOf(s.age).id === g.id), 'x'); }
  if (scope === 'club') { add(G.clubmates, 'pool'); add(G.rivals.filter(r => r.clubId === p.clubId), 'x'); }
  const mine = playerSeasonBest(ev);
  list.push({ name: p.name, nat: p.nat, region: p.region, age: p.age, ratio: mine == null ? 9 : mine, me: true, clubId: p.clubId });
  // de-dup names within a list
  const seen = {}; list.forEach(x => { if (seen[x.name] && !x.me) x.name = x.name + ' ' + String.fromCharCode(65 + (seen[x.name] % 26)); seen[x.name] = (seen[x.name] || 0) + 1; });
  list.sort((a, b) => a.ratio - b.ratio);
  return list;
}
function playerRank(ev, scope) {
  const l = rankingList(ev, scope); const me = l.find(x => x.me); if (me.ratio >= 9) return null;
  const faster = l.filter(x => !x.me && x.ratio < me.ratio).length;
  // beyond the modelled pool, estimate how many unmodelled swimmers are faster (depth grows quickly with ratio)
  const poolOnly = l.filter(x => x.pool === 'pool'); const last = poolOnly[poolOnly.length - 1];
  const k = { world: 90, national: 40, regional: 2.5, age: 5, club: 0 }[scope] || 0;
  const extra = last && me.ratio > last.ratio ? Math.round(Math.pow((me.ratio - last.ratio) / 0.01, 1.5) * k) : 0;
  return faster + extra + 1;
}

// ---------- DYNAMIC RECORDS (AI swimmers break records too) ----------
function aiRecordCheck(sw, ev, course, time, meetName, alsoMeet) {
  const p = G.player; const out = [];
  const chk = (label, rec, set) => { if (rec && time < rec.time) { out.push(label); set({ time, holder: sw.name, country: sw.nat, date: isoDate(currentDate()), derived: false, ai: true }); } };
  chk('World record', wr(course, p.gender, ev), v => { G.records.world = G.records.world || { LCM: {}, SCM: {} }; G.records.world[course][ev] = v; });
  if (sw.age <= 18) chk('World junior record', G.records.worldJunior[course][ev], v => { G.records.worldJunior[course][ev] = v; });
  if (sw.nat === p.nat) {
    chk(CTRY(p.nat).name + ' record', G.records.national[course][ev], v => { G.records.national[course][ev] = v; });
    if (sw.region === p.region) chk(p.region + ' record', G.records.regional[course][ev], v => { G.records.regional[course][ev] = v; });
    const ag = ageGroupOf(sw.age); if (G.records.ageGroup[course][ev][ag.id]) chk(ag.id + ' age group record', G.records.ageGroup[course][ev][ag.id], v => { G.records.ageGroup[course][ev][ag.id] = v; });
  }
  if (alsoMeet) chk('Meet record', meetRecord(alsoMeet, ev), v => { G.records.meet[alsoMeet.tid + '|' + course + '|' + ev] = v; });
  if (out.length) { const big = out[0].startsWith('World'); addNews(`${out[0].toUpperCase()}: ${sw.name} ${fmt(time)} in the ${EV(ev).name}`, `${FLAG(sw.nat)} ${sw.name} (${sw.age}) set a new ${out.join(' and ').toLowerCase()} at ${meetName} (${course}).`, big ? 'purple' : ''); }
  return out;
}
// Simulate the rest of the world racing when the player isn't there (called on the international-meet week and nationals week)
function simWorldSeason(kind) {
  const p = G.player; const course = 'LCM';
  EVENTS.forEach(e => {
    const cands = kind === 'world' ? G.pools.world.slice().sort((a, b) => a.sb[e.id] - b.sb[e.id]).slice(0, 8) : G.pools.national.filter(s => ageGroupOf(s.age).id === 'open').sort((a, b) => a.sb[e.id] - b.sb[e.id]).slice(0, 6);
    cands.forEach(s => { const t = s.ab[e.id] * wr('LCM', p.gender, e.id).time * (1 + R.n(-0.002, 0.006)); s.sb[e.id] = Math.min(s.sb[e.id], t / wr('LCM', p.gender, e.id).time); aiRecordCheck(s, e.id, course, t, kind === 'world' ? internationalMeetForYear(G.seasonYear + 1).name : CTRY(p.nat).nationals); });
  });
}

// ---------- WEEK ADVANCE ----------
function advanceWeek() {
  if (G.player.retired) { toast('You are retired — use "Come out of retirement" on the career screen', 'red', 5000); UI.screen = 'career'; render(); return; }
  if (G.activeMeet) { toast('Finish the current meet first', 'red'); return; }
  const res = advanceWeekCore(); if (res === 'season') return;
  saveGame(true); render();
}
function advanceToMeet() {
  if (G.player.retired) { toast('You are retired', 'red'); return; }
  if (G.activeMeet) { go('meet'); return; }
  let n = 0; const startWeek = G.week;
  while (n++ < 60) {
    if (!nextEnteredMeet()) break;
    const res = advanceWeekCore();
    if (res === 'season') return;
    if (res === 'meet') break;
    if (G.player.injury && G.player.injury.weeks >= 2) { toast('Stopped: injury — adjust your plan', 'red'); break; }
  }
  toast(`Advanced ${G.week - startWeek} week(s)`);
  saveGame(true); render();
}
function advanceWeekCore() {
  const p = G.player; healPlayer('week'); const prevAge = p.age;
  applyTrainingWeek(); developRivalsWeek(); weeklyIncome(); checkTitles();
  G.week++;
  if (G.week > 52) { endSeason(); return 'season'; }
  p.age = ageAt(p.dob, currentDate());
  if (p.age !== prevAge) addNews(`Happy birthday, ${p.name.split(' ')[0]}!`, `${p.name} turns ${p.age} today.`, 'aqua');
  const meet = G.calendar.find(m => m.week === G.week && !m.done);

  }

}

// ---------- MEETS ----------
function startMeet(meet) {
  const p = G.player;
  const schedule = [];
  const evs = meet.entries.slice().sort((a, b) => EVENTS.findIndex(e => e.id === a) - EVENTS.findIndex(e => e.id === b));
  evs.forEach((ev, i) => {
    const d = EV(ev).dist; const day = 1 + Math.floor(i * meet.days / evs.length);
    if (meet.structure === 'timed' || d >= 800) schedule.push({ ev, round: 'final', day, timed: true });
    else if (meet.structure === 'hf' || d >= 400) { schedule.push({ ev, round: 'heat', day }); schedule.push({ ev, round: 'final', day }); }
    else { schedule.push({ ev, round: 'heat', day }); schedule.push({ ev, round: 'semi', day }); schedule.push({ ev, round: 'final', day: Math.min(meet.days, day + 1) }); }
  });
  G.activeMeet = { ...meet, schedule, idx: 0, fields: {}, results: {}, log: [], ag: meet.masters ? mastersBandOf(p.age).id : meet.ageGroup ? ageGroupOf(p.age).id : 'open' };
  meet.entries.forEach(ev => { G.activeMeet.fields[ev] = buildField(G.activeMeet, ev); });
  addNews(`${meet.name} begins`, `${p.name} is entered in ${evs.map(e => EV(e).name).join(', ')}.`, 'aqua');
  UI.screen = 'meet';
}

  const mk = (s, tag) => ({ id: s.id, name: s.name, nat: s.nat, region: s.region, age: s.age, isRival: s.isRival, tag, abLCM: s.ab[ev] * wr('LCM', gender, ev).time, isPlayer: false, clubId: s.clubId, rec: s.rec || (s.rec = compRecord({ abLCM: s.ab['100FR'] * wr('LCM', gender, '100FR').time })), title: s.title });
  let cands = [];
  const tier = meet.tier; const pool = MEET_TIERS[tier].pool;
  const myAG = ageGroupOf(p.age).id; const agOK = s => !meet.ageGroup || ageGroupOf(s.age).id === myAG;
  const regionalPool = pool === 'local' || pool === 'regional' || pool === 'provincial';
  const rivalsIn = G.rivals.filter(r => agOK(r) && (!meet.masters || (mastersBandOf(r.age) && mastersBandOf(r.age).id === mastersBandOf(p.age).id)) && (regionalPool ? r.region === p.region : true) && (std ? r.ab[ev] * courseFactor(course, ev) <= stdR * 1.01 : true) && !(meet.maxAge && r.age > meet.maxAge)).map(r => mk(r, 'rival'));
  if (pool === 'local') {
    const n = tier === 'dual' ? 9 : tier === 'club' ? 12 : 22; const myR = abilityRatio(p, ev);
    G.clubmates.filter(c => agOK(c) && Math.abs(c.ab[ev] - myR) < 0.3).forEach(c => cands.push(mk(c, 'club')));
    if (tier === 'invite') G.pools.provincial.filter(s => agOK(s) && Math.abs(s.ab[ev] - myR) < 0.22).slice(0, 14).forEach(s => cands.push(mk(s, 'prov')));
    for (let i = cands.length; i < n; i++) { const ag = meet.ageGroup ? agRandomAge(myAG) : R.i(p.age - 2, p.age + 3); const s = makeAgeGroupEntry(p.nat, p.region, clamp(ag, 7, 30), myR * (1 + R.n(0.03, 0.06)), 'local'); cands.push(mk(s, 'local')); }
    cands.push(...rivalsIn);
  } else {
    const qual = s => agOK(s) && s.ab[ev] <= stdR * 1.02 && !(meet.maxAge && s.age > meet.maxAge) && !(meet.minAge && s.age < meet.minAge);
    if (pool === 'regional' || pool === 'provincial') { cands = [...G.pools.provincial.filter(qual), ...G.pools.national.filter(s => s.region === p.region && qual(s))].map(s => mk(s, 'prov')); if (pool === 'regional') G.clubmates.filter(qual).forEach(c => cands.push(mk(c, 'club'))); }
    if (pool === 'national') { cands = [...G.pools.national.filter(qual), ...G.pools.provincial.filter(qual)].map(s => mk(s, 'nat')); }
    if (pool === 'world') { cands = G.pools.world.filter(qual).map(s => mk(s, 'world')); G.pools.national.filter(qual).slice(0, 3).forEach(s => cands.push(mk(s, 'nat'))); if (tier === 'worldcup') cands = cands.sort(() => R.u() - .5).slice(0, 23); }
    if (pool === 'ncaa') {
      ensureUniPools(); const me_u = currentUni(); const div = me_u ? me_u.ncaa : 'D1';
      let list = G.pools.ncaa.filter(s => tier === 'ncaaChamps' ? s.div === 'D1' && s.ab[ev] * SCY_FACTORS[EV(ev).dist] <= (stdR * 1.02) : tier === 'ncaaConf' ? s.conf === me_u.conf : s.div === div);
      if (tier === 'ncaaDual') list = list.filter(s => s.uniId === me_u.id || R.chance(0.25)).slice(0, 14); if (tier === 'ncaaInvite') list = list.sort(() => R.u() - .5).slice(0, 30);
      cands = list.map(s => mk(s, 'ncaa'));
    }
    if (pool === 'uni') { ensureUniPools(); const me_u = currentUni(); cands = G.pools.uni.filter(s => tier === 'uniChamps' || s.uniId === me_u.id || R.chance(0.3)).map(s => mk(s, 'uni')); G.pools.national.filter(s => s.age >= 18 && s.age <= 23).slice(0, 8).forEach(s => cands.push(mk(s, 'uni'))); }
    if (pool === 'masters') {
      ensureMastersPool(); const band = mastersBandOf(p.age); const inBand = s => mastersBandOf(s.age) && mastersBandOf(s.age).id === band.id;
      cands = (G.pools.masters || []).filter(s => inBand(s) && (tier === 'mastersWorld' || s.nat === p.nat) && (tier !== 'mastersProv' || s.region === p.region || R.chance(0.3)) && (tier !== 'mastersClub' || R.chance(0.35))).map(s => mk(s, 'masters'));
    }
    if (pool === 'worldmix') {
      const foreign = meet.ageGroup ? [] : G.pools.world.filter(qual).sort(() => R.u() - .5).slice(0, 14);
      cands = foreign.map(s => mk(s, 'world')); [...G.pools.national.filter(qual), ...G.pools.provincial.filter(qual)].forEach(s => cands.push(mk(s, 'nat')));
      const others = COUNTRIES.filter(x => x.code !== p.nat); const want = meet.ageGroup ? 18 : 10;
      for (let i = 0; i < want; i++) { const oc = R.pick(others); const ag = meet.ageGroup ? agRandomAge(myAG) : R.i(18, 27); const s = makeAgeGroupEntry(oc.code, R.pick(oc.regions), ag, stdR * (0.93 + R.u() * 0.09), 'intl'); cands.push(mk(s, 'world')); }
    }
    cands.push(...rivalsIn);
    cands.sort((a, b) => a.abLCM - b.abLCM);
    const cap = meet.structure === 'timed' ? 40 : 48;
    if (cands.length > cap) cands = cands.slice(0, cap);
    // pad thin fields with swimmers just under the standard
    const minField = meet.masters || meet.ncaa || meet.uni ? 8 : meet.ageGroup ? 25 : 16;
    if (meet.ncaa || meet.uni) { while (cands.length < minField) { const s = makeAgeGroupEntry(meet.ncaa ? 'USA' : p.nat, p.region, R.i(18, 22), abilityRatio(p, ev) * (1 + R.n(0.03, 0.05)), 'local'); cands.push(mk(s, 'local')); } }
    if (meet.masters) { const band = mastersBandOf(p.age); while (cands.length < minField) { const s = makeMastersEntry(p.nat, p.region, band, R.u()); G.pools.masters.push(s); cands.push(mk(s, 'masters')); } }
    while (cands.length < minField) { const ag = meet.ageGroup ? agRandomAge(myAG) : R.i(Math.max(15, p.age - 2), p.age + 4); const s = makeAgeGroupEntry(p.nat, regionalPool ? p.region : R.pick(CTRY(p.nat).regions), clamp(ag, 7, 30), Math.min(stdR * 1.01, abilityRatio(p, ev) * (1 + R.n(0.04, 0.05))), 'local'); cands.push(mk(s, 'local')); }
  }
  // meet-day form for AI: tapered for big meets
  const tierForm = ({ club: 1.012, dual: 1.012, invite: 1.008, regional: 1.006, provincial: 1.003, juniorNational: 1.0, national: 0.998, trials: 0.996, worldcup: 1.002, international: 0.994, intlInvite: 1.0, ncaaDual: 1.01, ncaaInvite: 1.004, ncaaConf: 0.997, ncaaChamps: 0.995, uniDual: 1.01, uniChamps: 0.999, mastersClub: 1.01, mastersProv: 1.005, mastersNat: 1.0, mastersWorld: 0.997 })[tier] || 1.0;
  cands.forEach(c => { c.meetTime = c.abLCM * courseFactor(course, ev) * tierForm * (1 + R.n(0, 0.007)); c.seed = seedTime(c, ev, course); });
  const me = { id: 'me', name: p.name, nat: p.nat, region: p.region, age: p.age, isPlayer: true, abLCM: abilityTime(p, ev, 'LCM'), seed: playerSeed(ev, course), clubId: p.clubId };
  // de-duplicate generated names
  const seen = {}; cands.forEach(c => { if (seen[c.name]) { const parts = c.name.split(' '); c.name = parts[0] + ' ' + R.pick(NAME_BANKS[CTRY(c.nat).names].L); } seen[c.name] = 1; });
  cands.push(me);
  cands.sort((a, b) => (a.seed || 9999) - (b.seed || 9999));

}
function seedTime(c, ev, course) { return c.abLCM * courseFactor(course, ev) * (1 + Math.abs(R.n(0.004, 0.006))); }
function playerSeed(ev, course) { const pb = G.player.pbs[ev + '|' + course]; if (pb) return pb.time; for (const c of ['LCM', 'SCM', 'SCY']) { const alt = G.player.pbs[ev + '|' + c]; if (alt) return toLCM(alt.time, c, ev) * courseFactor(course, ev); } return null; }

function currentSession() { const m = G.activeMeet; return m ? m.schedule[m.idx] : null; }

// Determine who swims the round; returns {lanes:[swimmers in player's heat], others:[simulated swimmers]}
function roundField(meet, ev, round) {
  const all = meet.fields[ev]; const res = meet.results[ev] || {};
  let entrants;
  if (round === 'heat' || (round === 'final' && currentSession().timed)) entrants = all.slice();
  else if (round === 'semi') entrants = res.heat.slice(0, 16);
  else entrants = (res.semi || res.heat).slice(0, 8);
  // sort by qualifying time
  const key = round === 'heat' || currentSession().timed ? 'seed' : (round === 'semi' ? 'heatTime' : (res.semi ? 'semiTime' : 'heatTime'));
  entrants.sort((a, b) => (a[key] || 9999) - (b[key] || 9999));
  let heatSize = round === 'final' && !currentSession().timed ? 8 : 8;
  if (meet.tier === 'club' || meet.tier === 'dual') heatSize = 6;
  // build heats: fastest heat last
  const heats = []; const n = Math.ceil(entrants.length / heatSize);
  for (let h = 0; h < n; h++) heats.push([]);
  // balanced heats: sizes differ by at most one, fastest heat first
  const base = Math.floor(entrants.length / n); let rem = entrants.length - base * n; let idx = 0;
  for (let h = 0; h < n; h++) { const size = base + (rem > 0 ? 1 : 0); if (rem > 0) rem--; for (let k = 0; k < size; k++) heats[h].push(entrants[idx++]); }
  // top heat = heats[0] (fastest). Player's heat:
  const myHeatIdx = heats.findIndex(h => h.some(s => s.isPlayer));
  const my = heats[myHeatIdx];
  // lane assignment: fastest centre lanes
  const laneOrder = my.length <= 6 ? [3, 4, 2, 5, 1, 6] : [4, 5, 3, 6, 2, 7, 1, 8];
  my.forEach((s, i) => s.lane = laneOrder[i]);
  const others = heats.filter((h, i) => i !== myHeatIdx).flat();
  return { lanes: my.sort((a, b) => a.lane - b.lane), others, heatNo: n - myHeatIdx, heatCount: n, entrants };
}

const RACE = { on: false };
// Timing assist: slow-motion at the walls and how wide the press windows are
const ASSIST = { easy: { slow: 0.28, win: 1.5, label: 'Easy', desc: 'Strong slow-mo at walls, generous windows' }, normal: { slow: 0.36, win: 1.15, label: 'Normal', desc: 'Slow-mo at walls, fair windows' }, pro: { slow: 1, win: 0.7, label: 'Pro', desc: 'Real-speed walls, tight windows, bigger rewards' } };
function assist() { return ASSIST.normal; }
function setAssist(k) { UI.assist = k; try { localStorage.setItem('swimcareer_assist', k); } catch (e) { } }
function gradeErr(err) { const w = assist().win * (1 + (G.player.attrs.turn - 50) / 250); const a = Math.abs(err); return a <= 0.14 * w ? 'perfect' : a <= 0.32 * w ? 'good' : 'poor'; }
function say(msg, cls) { const r = RACE; if (!r.on) return; r.msgs.push({ msg, cls, at: r.real }); }
// Neutral-execution correction so that an average race lands on the swimmer's ability time (see test/calib.js)
function RACE_CALIB(r) { return 1 / (1 + 0.0105 * 50 / r.lenLen - (r.e.dist >= 200 ? 0.0045 : 0.0025)); }
const EFFORT_SPEED = { 1: 0.95, 2: 0.98, 3: 1.0, 4: 1.02, 5: 1.045 };
const EFFORT_DRAIN = { 1: 0.45, 2: 0.7, 3: 1.0, 4: 1.45, 5: 2.1 };
const STRATEGIES = {
  even:  { name: 'Even Pace',        desc: 'Hold planned pace throughout. Safe and consistent.', seg: [0, 0, 0] },
  front: { name: 'Front-load',       desc: 'Go out hard, hang on. Risky in longer events.', seg: [1, 0, -1] },
  neg:   { name: 'Negative Split',   desc: 'Controlled first half, build through the back end.', seg: [-1, 0, 1] },
  kick:  { name: 'Conserve & Kick',  desc: 'Sit back, save energy, unleash a big final sprint.', seg: [-1, -1, 2] },
};
function plannedEffort(dist) { return dist <= 50 ? 5 : dist <= 100 ? 4 : 3; }
function splitWeights(ev, lengths) {
  const e = EV(ev); const w = [];
  const fade = e.stroke === 'breast' || e.stroke === 'fly' ? 0.075 : e.dist >= 400 ? 0.028 : 0.05;
  for (let i = 0; i < lengths; i++) { let x = 1 + fade * (lengths > 1 ? i / (lengths - 1) : 0); if (i === 0) x *= 0.90; if (e.dist >= 400 && i === lengths - 1) x *= 0.975; if (e.stroke === 'im') { const q = Math.floor(i * 4 / lengths); x *= [0.95, 1.06, 1.12, 0.97][q]; } w.push(x); }
  const s = w.reduce((a, b) => a + b, 0); return w.map(x => x / s);
}

function beep(freq = 880, dur = 0.15) { try { const ac = RACE.ac || (RACE.ac = new (window.AudioContext || window.webkitAudioContext)()); const o = ac.createOscillator(); const g = ac.createGain(); o.frequency.value = freq; o.connect(g); g.connect(ac.destination); g.gain.value = 0.15; o.start(); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur); o.stop(ac.currentTime + dur); } catch (e) { } }

// ---------- RACE END ----------
function finishRace() {

  r.sw.forEach(x => { if (!x.finished) { x.finished = true; x.time = x.isPlayer ? Math.max(x.t, r.T) : x.cum[x.cum.length - 1]; } });
  // full-round results: my heat + simulated others
  const s = r.s; const meet = r.meet; const ev = s.ev;
  const roundKey = s.round + 'Time';
  const results = r.sw.map(x => { const { cum, lt, ...rest } = x; return rest; });
  r.rf.others.forEach(o => { const rf = s.round === 'heat' && !s.timed ? 1.007 : s.round === 'semi' ? 1.002 : 0.997; let t = o.meetTime * rf * (1 + R.n(0, 0.005)); if (!Number.isFinite(t)) t = (o.seed || r.T) * (1 + R.n(0.01, 0.02)); results.push({ ...o, time: t, simulated: true }); });

  const field = meet.fields[ev]; results.forEach(x => { const f = field.find(y => y.id === x.id); if (f) f[roundKey] = x.time; });
  meet.results[ev] = meet.results[ev] || {}; meet.results[ev][s.round] = results;
  const mine = results.find(x => x.isPlayer);

  updateRivalries(meet, s, results, mine); updateCompRecords(results, s);
  results.filter(x => !x.isPlayer).forEach(x => { const src = findPoolSwimmer(x.id); if (src) { const rr = toLCM(x.time, meet.course, ev) / wr('LCM', G.player.gender, ev).time; if (!(src.sb[ev] <= rr)) src.sb[ev] = rr; } });
  const outcome = processResult(meet, s, mine, r.me.splits.slice());
  const rw = document.getElementById('racewrap'); if (rw) rw.remove(); RACE.wearSuit = null;
  UI.screen = 'raceResult'; UI.lastResult = { meet, s, results, mine, outcome, heat: r.sw.map(x => ({ name: x.name, nat: x.nat, time: x.time, lane: x.lane, isPlayer: x.isPlayer, isRival: x.isRival, splits: x.splits })) };
  saveGame(true); render();
  if (s.round === 'final' && meet.stars >= 2 && mine.place <= 3 && document.getElementById('app')) medalCeremony(meet, s, results);
}

  document.body.appendChild(d);
